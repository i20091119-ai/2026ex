<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 아케이드 기계 모니터, 노트북, 태블릿 어디서든 잘 보이게 하는 설정이에요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>독립을 향하여 - 서진모둠</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================================================================
     이 게임은 화면이 3개예요.
     1) 시작 화면  2) 게임 화면  3) 끝 화면
     한 번에 하나씩만 보여주고 나머지는 숨겨둬요.
     ================================================================ -->
<div id="app">

  <!-- ============ 1) 시작 화면 ============ -->
  <!-- 학생들이 그린 그림 그대로 만들었어요!
       제목은 태극기 색(빨강+파랑), 가운데 Start,
       오른쪽 아래 태극기, 왼쪽 아래 설명란 -->
  <section id="screen-title" class="screen is-on">

    <!-- 제목 : '독립을'은 빨강, '향하여'는 파랑이에요 -->
    <h1 class="game-title">
      <span class="t-red">독립을</span>
      <span class="t-blue">향하여</span>
    </h1>

    <!-- 가운데 큰 Start 글씨와 동그란 재생 버튼 -->
    <div class="start-block">
      <div class="start-word">Start</div>
      <button id="btn-start" class="play-btn" aria-label="게임 시작">▶</button>
    </div>

    <!-- 팀 이름 -->
    <p class="team-name">팀 - 서진</p>
    <p class="team-members">서진 · 조찬우 · 박윤진</p>

    <!-- 왼쪽 아래 : 설명란 -->
    <div class="corner-help">
      <span class="corner-label">설명란</span>
      <button id="btn-info" class="round-btn" aria-label="게임 설명 보기">?</button>
    </div>

    <!-- 오른쪽 아래 : 태극기 (CSS로 직접 그렸어요) -->
    <div class="corner-flag">
      <div class="taegeukgi" aria-label="태극기">
        <div class="taegeuk"></div>
        <span class="gwe gwe1"></span>
        <span class="gwe gwe2"></span>
        <span class="gwe gwe3"></span>
        <span class="gwe gwe4"></span>
      </div>
    </div>

  </section>


  <!-- ============ 2) 게임 화면 ============ -->
  <section id="screen-game" class="screen">

    <!-- 점수판이에요. 게임하는 동안 항상 위에 보여요 -->
    <header id="hud">
      <div class="hud-chapter">
        <span class="hud-label">장</span>
        <span id="hud-chapter-name">1장 · 비밀 편지</span>
      </div>

      <!-- 목숨(하트)이에요. 경찰에게 들키면 하나씩 줄어요 -->
      <div class="hud-life">
        <span class="hud-label">목숨</span>
        <span id="hud-hearts">❤️❤️❤️</span>
      </div>

      <div class="hud-score">
        <span class="hud-label">독립 포인트</span>
        <span id="hud-score">0</span>
      </div>
    </header>

    <!-- 게임이 실제로 펼쳐지는 무대예요 -->
    <div id="stage">
      <div id="stage-inner">
        <!-- 각 장의 미션이 여기에 들어와요 (아직 만드는 중이에요) -->
        <p class="todo-note">여기에 미션이 들어갈 거예요</p>
      </div>
    </div>

    <!-- 미션을 알려주는 말풍선이에요 -->
    <div id="bubble">
      <div id="bubble-face">🧑</div>
      <div id="bubble-text">말풍선 내용</div>
    </div>

    <!-- ---- 조작 안내판 ----
         어떤 버튼이 무슨 일을 하는지 알려줘요.
         진짜로 버튼을 누르면 그 칸에 불이 반짝 들어와요! -->
    <div id="pad-guide">
      <div class="pad-stick" id="pad-stick">
        <span class="pad-key">🕹️</span>
        <span class="pad-name">움직이기</span>
        <span class="pad-arrows">
          <b data-dir="up">▲</b><b data-dir="left">◀</b><b data-dir="down">▼</b><b data-dir="right">▶</b>
        </span>
      </div>
      <div id="pad-buttons"><!-- 버튼 8개가 자바스크립트로 여기에 그려져요 --></div>
      <div class="pad-device" id="pad-device">조종기 연결 안 됨</div>
    </div>

  </section>


  <!-- ============ 3) 끝 화면 ============ -->
  <section id="screen-end" class="screen">
    <div class="title-box">
      <div id="end-emoji">🎉</div>
      <h2 id="end-title">광복!</h2>
      <p id="end-message">모든 임무를 마쳤어요!</p>

      <div class="score-card">
        <span class="hud-label">내 독립 포인트</span>
        <strong id="end-score">0</strong>
      </div>

      <button id="btn-retry" class="big-btn">다시 하기</button>
    </div>
  </section>


  <!-- ============ 덮개 화면 ============
       멈추기 / 도움말 / 처음으로 를 눌렀을 때
       게임 위에 덮어서 보여주는 창이에요. -->
  <div id="overlay">
    <div class="overlay-card">
      <div id="overlay-emoji">⏸️</div>
      <h3 id="overlay-title">잠깐 멈춤</h3>
      <div id="overlay-body"></div>
      <div id="overlay-actions"></div>
    </div>
  </div>

  <!-- 화면을 크게/작게 했을 때 잠깐 뜨는 알림이에요 -->
  <div id="zoom-toast">화면 크기 100%</div>

</div>

<script src="js/sound.js"></script>
<script src="js/input.js"></script>
<script src="js/missions.js"></script>
<script src="js/ch1.js"></script>
<script src="js/game.js"></script>
</body>
</html>
