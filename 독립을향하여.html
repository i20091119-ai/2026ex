<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 아케이드 기계 모니터, 노트북, 태블릿 어디서든 잘 보이게 하는 설정이에요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>독립을 향하여 - 서진모둠</title>
  <style>
/* ==================================================================
   독립을 향하여 - 꾸미기 파일 (CSS)
   1~5장은 어두운 밤 느낌, 6장 광복은 환하게 바뀌어요.
   ================================================================== */

/* ---------- 색깔을 이름표에 저장해 둬요 ----------
   이렇게 해두면 나중에 색을 바꿀 때 여기만 고치면 돼요! */
:root {
  --bg-1: #10152a;          /* 먹빛 남색 (한밤의 조선) */
  --bg-2: #1a2340;          /* 조금 밝은 먹빛 남색 */
  --ink: #080b16;           /* 거의 검정에 가까운 먹색 */

  --paper: #ded5c2;         /* 오래된 한지 색 (글자에 써요) */
  --paper-dim: #9d9város;   /* (아래에서 다시 정해요) */
  --ochre: #c8a25a;         /* 놋쇠 · 황토색 (강조할 때) */
  --moss: #6f8f6a;          /* 낡은 국방색 (안전 표시) */

  --flag-red: #cd2e3a;      /* 태극기 빨강 */
  --flag-blue: #0047a0;     /* 태극기 파랑 */
  --red-lit: #d94452;       /* 어두운 배경에서도 보이는 빨강 */
  --blue-lit: #5b93d6;      /* 어두운 배경에서도 보이는 파랑 */

  --line: rgba(222, 213, 194, 0.18);   /* 은은한 선 */
  --round: 4px;             /* 모서리를 각지게! */
}

/* 낡은 한지색 글자 (조금 흐린 것) */
:root { --paper-dim: rgba(222, 213, 194, 0.62); }

/* 6장 광복이 되면 body에 'liberation' 이름표를 붙여요.
   그러면 어둡던 화면이 새벽처럼 밝아져요. */
body.liberation {
  --bg-1: #cfd9e6;          /* 새벽 하늘 */
  --bg-2: #eae4d6;          /* 밝은 한지 */
  --paper: #1a2340;         /* 밝은 배경이니 글자는 먹색으로 */
  --paper-dim: rgba(26, 35, 64, 0.66);
  --line: rgba(26, 35, 64, 0.22);
}

/* ---------- 기본 설정 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
               "Malgun Gothic", sans-serif;
  background: var(--ink);
  color: var(--paper);
  overflow: hidden;              /* 아케이드 화면이라 스크롤은 막아요 */
  -webkit-user-select: none;     /* 글자가 드래그로 선택되지 않게 해요 */
  user-select: none;
  /* 색이 바뀔 때 스르륵 부드럽게 변해요 */
  transition: background 1.2s ease, color 1.2s ease;
}

#app {
  width: 100vw;
  height: 100vh;
  height: 100dvh;                /* 폰에서도 화면에 딱 맞게 */
  position: relative;
}

/* ---------- 화면 3개 공통 ---------- */
.screen {
  position: absolute;
  inset: 0;                      /* 화면 전체를 꽉 채워요 */
  display: none;                 /* 평소에는 숨어 있어요 */
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3vh 4vw;
  background:
    /* 가장자리를 어둡게 해서 화면에 무게감을 줘요 */
    radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0, 0, 0, 0.45) 100%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  transition: background 1.2s ease;
}

/* 'is-on' 이름표가 붙은 화면 하나만 보여요 */
.screen.is-on {
  display: flex;
  animation: fadeIn 0.5s ease;   /* 스르륵 나타나요 */
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}

/* ==================================================================
   1) 시작 화면 꾸미기
      ★ 서진모둠 학생들이 그린 그림 그대로 만들었어요 ★
   ================================================================== */
/* .screen 이 이미 화면 전체에 딱 붙어 있어서,
   왼쪽 아래 설명란과 오른쪽 아래 태극기는 그 모서리에 자리잡아요.
   (여기에 position 을 또 쓰면 화면이 짧아지니 조심!) */

.title-box {
  text-align: center;
  max-width: 640px;
  width: 100%;
}

/* ---------- 제목 ----------
   그림처럼 '독립을'은 빨강, '향하여'는 파랑이에요. 태극기 색이죠! */
.game-title {
  font-size: clamp(34px, 6.5vw, 62px);
  letter-spacing: 2px;
  display: flex;
  gap: 0.5em;
  flex-wrap: wrap;
  justify-content: center;
}

.t-red {
  color: var(--red-lit);                            /* 태극기 빨강 */
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}

.t-blue {
  color: var(--blue-lit);                           /* 태극기 파랑 */
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}

/* ---------- 가운데 큰 Start 글씨 ---------- */
.start-block {
  margin-top: clamp(14px, 3vh, 30px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.start-word {
  font-size: clamp(58px, 13vw, 128px);
  font-weight: 900;
  letter-spacing: 3px;
  color: #ffffff;
  /* 그림처럼 글자 테두리를 두껍게 그려요 */
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
}

/* 동그란 ▶ 재생 버튼 */
.play-btn {
  width: clamp(58px, 9vw, 82px);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  font-size: clamp(22px, 3.6vw, 32px);
  color: var(--ink);
  background: var(--paper);
  border: 3px solid var(--ink);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding-left: 5px;                    /* ▶ 모양이 가운데 오게 살짝 밀어요 */
  transition: background 0.15s ease, transform 0.08s ease;
}

.play-btn:hover { background: var(--ochre); }
.play-btn:active { transform: translateY(2px); }

/* ---------- 팀 이름 ---------- */
.team-name {
  margin-top: clamp(14px, 3vh, 28px);
  font-size: clamp(19px, 3.4vw, 30px);
  font-weight: 800;
  color: var(--paper-dim);
  letter-spacing: 6px;
}

.team-members {
  margin-top: 7px;
  font-size: clamp(11px, 1.8vw, 14px);
  opacity: 0.6;
}

/* ---------- 왼쪽 아래 : 설명란 ---------- */
.corner-help {
  position: absolute;
  left: clamp(14px, 3vw, 34px);
  bottom: clamp(14px, 3vh, 30px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.corner-label {
  font-size: clamp(11px, 1.7vw, 14px);
  opacity: 0.85;
}

/* 동그란 ? 버튼이에요 */
.round-btn {
  width: clamp(34px, 5vw, 46px);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  font-family: inherit;
  font-size: clamp(16px, 2.6vw, 22px);
  font-weight: 800;
  color: var(--paper);
  background: transparent;
  border: 2px solid var(--line);
  border-radius: var(--round);
  cursor: pointer;
  transition: all 0.15s ease;
}

.round-btn:hover { border-color: var(--ochre); color: var(--ochre); }
.round-btn:active { transform: translateY(2px); }

/* ---------- 오른쪽 아래 : 태극기 ---------- */
.corner-flag {
  position: absolute;
  right: clamp(14px, 3vw, 40px);
  bottom: clamp(14px, 3vh, 30px);
  transform: rotate(-3deg);     /* 그림처럼 살짝 기울어져 있어요 */
}

/* ---------- 큰 버튼 (둥글고 말랑말랑해요) ---------- */
.big-btn {
  font-family: inherit;
  font-size: clamp(16px, 2.6vw, 22px);
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--ink);
  padding: 14px 40px;
  border: none;
  border-radius: var(--round);
  background: var(--ochre);              /* 놋쇠빛 한 가지 색 */
  cursor: pointer;
  transition: background 0.15s ease, transform 0.08s ease;
}

.big-btn:hover { background: #d9b573; }

/* 누르면 살짝 눌리기만 해요 (통통 튀지 않아요) */
.big-btn:active { transform: translateY(2px); }

/* ==================================================================
   태극기 그림 (그림 파일 없이 CSS로 직접 그렸어요!)
   ================================================================== */
.taegeukgi {
  width: clamp(120px, 22vw, 210px);
  aspect-ratio: 3 / 2;                 /* 태극기는 가로:세로가 3:2예요 */
  margin: 0 auto;
  position: relative;
  background: #f2ede2;                 /* 살짝 바랜 흰색 */
  border-radius: 2px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
}

/* 가운데 동그란 태극 무늬 */
.taegeuk {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) rotate(-33deg);
  width: 40%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  /* 위쪽 절반은 빨강, 아래쪽 절반은 파랑 */
  background: linear-gradient(to bottom, var(--flag-red) 50%, var(--flag-blue) 50%);
}

/* 네 귀퉁이의 검은 막대(괘)예요 */
.gwe {
  position: absolute;
  width: 17%;
  height: 3.5px;
  background: #1a1a1a;
  border-radius: 2px;
}
.gwe1 { top: 22%; left: 12%; }
.gwe2 { top: 22%; right: 12%; }
.gwe3 { bottom: 22%; left: 12%; }
.gwe4 { bottom: 22%; right: 12%; }



/* ==================================================================
   2) 게임 화면 꾸미기
   ================================================================== */
#screen-game {
  justify-content: flex-start;
  padding: 0;
}

/* ---------- 점수판 (항상 위에 보여요) ---------- */
#hud {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(6px);
}

.hud-chapter, .hud-score, .hud-life {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 16px;
  border-radius: var(--round);
  background: rgba(255, 255, 255, 0.11);
  border: 2px solid rgba(255, 255, 255, 0.16);
}

.hud-label {
  font-size: clamp(10px, 1.5vw, 13px);
  opacity: 0.8;
}

#hud-chapter-name {
  font-size: clamp(13px, 2.2vw, 18px);
  font-weight: 700;
  color: var(--blue-lit);
}

#hud-score {
  font-size: clamp(19px, 3.2vw, 28px);
  font-weight: 800;
  color: var(--ochre);
}

/* 점수가 오르면 잠깐 커졌다 돌아와요 */
#hud-score.pop { animation: pop 0.45s ease; }

@keyframes pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.5); color: var(--red-lit); }
  100% { transform: scale(1); }
}

/* ---------- 목숨(하트) ---------- */
#hud-hearts {
  font-size: clamp(14px, 2.4vw, 20px);
  letter-spacing: 2px;
}

/* 하트가 줄어들 때 부르르 떨려요 */
#hud-hearts.shake { animation: shake 0.5s ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-7px) scale(1.2); }
  40%      { transform: translateX(7px) scale(1.2); }
  60%      { transform: translateX(-5px); }
  80%      { transform: translateX(5px); }
}

/* ---------- 게임 무대 ---------- */
#stage {
  flex: 1;                      /* 남은 공간을 전부 차지해요 */
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  position: relative;
  overflow: hidden;
}

#stage-inner {
  width: 100%;
  max-width: 900px;
  height: 100%;
  border-radius: var(--round);
  background: rgba(0, 0, 0, 0.22);
  border: 2px solid rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.todo-note { opacity: 0.5; font-size: 15px; }

/* ---------- 작은 버튼 ---------- */
.small-btn {
  display: block;
  margin: 0 auto;
  font-family: inherit;
  font-size: 13px;
  color: var(--paper);
  padding: 8px 20px;
  border: 2px solid rgba(255, 255, 255, 0.28);
  border-radius: var(--round);
  background: rgba(255, 255, 255, 0.09);
  cursor: pointer;
  transition: all 0.15s ease;
}

.small-btn:hover { background: rgba(255, 255, 255, 0.2); }

/* ---------- "들켰다!" 알림 ---------- */
.caught-box {
  text-align: center;
  animation: fadeIn 0.35s ease;
}

.caught-emoji {
  font-size: clamp(48px, 9vw, 78px);
}

.caught-box h3 {
  font-size: clamp(24px, 4.5vw, 36px);
  color: var(--flag-red);
  letter-spacing: 4px;
  margin: 12px 0 8px;
}

.caught-box p { font-size: clamp(12px, 2vw, 16px); line-height: 1.7; }
.caught-sub { opacity: 0.7; margin-top: 6px; }

/* ---------- 미션 말풍선 ---------- */
#bubble {
  width: calc(100% - 28px);
  max-width: 900px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-radius: var(--round);
  background: var(--paper);
  color: var(--ink);
  border-left: 5px solid var(--flag-red);
}

#bubble-face {
  font-size: clamp(20px, 3.4vw, 28px);
  flex: none;
}

#bubble-text {
  font-size: clamp(13px, 2.2vw, 18px);
  line-height: 1.6;
  font-weight: 600;
}

/* ==================================================================
   조작 안내판
   어떤 버튼이 무슨 일을 하는지 알려주고,
   진짜로 누르면 그 칸에 불이 반짝 들어와요!
   ================================================================== */
#pad-guide {
  width: calc(100% - 28px);
  max-width: 900px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--round);
  background: rgba(0, 0, 0, 0.32);
  border: 2px solid rgba(255, 255, 255, 0.12);
  flex-wrap: wrap;
  justify-content: center;
}

/* 방향 스틱 안내 */
.pad-stick {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.09);
}

.pad-stick .pad-key { font-size: 20px; }

.pad-name {
  font-size: clamp(9px, 1.4vw, 12px);
  opacity: 0.9;
}

.pad-arrows { display: flex; gap: 3px; }

.pad-arrows b {
  width: 19px; height: 19px;
  display: grid;
  place-items: center;
  font-size: 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.14);
  cursor: pointer;
  transition: all 0.1s ease;
}

/* 버튼 8개가 들어가는 칸 */
#pad-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}

.pad-btn {
  width: clamp(46px, 7vw, 60px);
  padding: 6px 3px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.09);
  border: 2px solid rgba(255, 255, 255, 0.14);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  transition: all 0.1s ease;
}

.pad-no {
  font-size: 9px;
  width: 15px; height: 15px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  font-weight: 800;
}

.pad-emoji { font-size: clamp(13px, 2vw, 17px); }

/* ★ 버튼을 진짜로 누르면 여기에 불이 들어와요 ★ */
.pad-btn.is-down,
.pad-arrows b.is-down {
  background: var(--ochre);
  color: var(--ink);
  border-color: #ffffff;
  transform: scale(1.14);
  box-shadow: 0 0 16px var(--ochre);
}

/* 지금 무엇으로 조작 중인지 알려주는 작은 글씨 */
.pad-device {
  font-size: clamp(9px, 1.3vw, 11px);
  opacity: 0.65;
  padding: 4px 10px;
  border-radius: var(--round);
  background: rgba(255, 255, 255, 0.07);
}

/* ==================================================================
   덮개 화면 (멈추기 / 도움말 / 처음으로)
   ================================================================== */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;                          /* 평소에는 숨어 있어요 */
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10, 14, 35, 0.82);     /* 뒤가 살짝 비치는 어두운 막 */
  backdrop-filter: blur(5px);
}

#overlay.is-on {
  display: flex;
  animation: fadeIn 0.25s ease;
}

.overlay-card {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  text-align: center;
  padding: 26px 24px;
  border-radius: var(--round);
  background: var(--bg-2);
  border: 2px solid var(--line);
  border-top: 4px solid var(--ochre);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
  color: var(--paper);
}

#overlay-emoji {
  font-size: clamp(11px, 1.7vw, 14px);
  letter-spacing: 6px;
  color: var(--ochre);
}

#overlay-title {
  font-size: clamp(20px, 4vw, 30px);
  margin: 6px 0 14px;
}

#overlay-body {
  font-size: clamp(12px, 2vw, 15px);
  line-height: 1.8;
  text-align: left;
}

#overlay-actions {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

/* 덮개 화면 안의 조작 설명 줄 */
.help-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  margin-bottom: 6px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
}

.help-row .no {
  width: 22px; height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--round);
  background: var(--ochre);
  color: var(--ink);
  font-weight: 800;
  font-size: 11px;
}

.help-row .keys {
  margin-left: auto;
  font-size: 11px;
  opacity: 0.7;
}

/* ---------- 화면 크기 알림 ---------- */
#zoom-toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  z-index: 60;
  padding: 11px 26px;
  border-radius: var(--round);
  background: var(--ochre);
  color: #0d1128;
  font-weight: 800;
  font-size: 15px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
}

#zoom-toast.is-on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ==================================================================
   3) 끝 화면 꾸미기
   ================================================================== */
#end-emoji {
  font-size: clamp(14px, 2.4vw, 20px);
  letter-spacing: 10px;
  color: var(--ochre);
}

#end-title {
  font-size: clamp(30px, 6vw, 52px);
  margin-top: 8px;
}

#end-message {
  margin-top: 10px;
  font-size: clamp(13px, 2.2vw, 18px);
  opacity: 0.9;
}

.score-card {
  margin: 24px auto;
  padding: 18px 30px;
  border-radius: var(--round);
  background: rgba(255, 255, 255, 0.11);
  border: 2px solid rgba(255, 255, 255, 0.18);
  display: inline-flex;
  flex-direction: column;
  gap: 6px;
}

.score-card strong {
  font-size: clamp(34px, 6vw, 52px);
  color: var(--ochre);
}

/* 조작 안내판에 조종기에 진짜 적힌 이름도 보여줘요 (A/X, Y/△ 같은 것들) */
.pad-arcade {
  font-size: 8px;
  opacity: 0.55;
  letter-spacing: -0.3px;
}

/* ==================================================================
   1장 · 비밀 편지  (무궁화 꽃이 피었습니다 놀이)
   ================================================================== */
.m1-scene {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
  padding: 14px;
}

/* ---------- 경찰 ---------- */
.m1-police {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  transition: transform 0.25s ease;
}

.m1-police .m1-face { font-size: clamp(40px, 8vw, 66px); }

.m1-police .m1-word {
  font-size: clamp(11px, 1.9vw, 15px);
  font-weight: 800;
  padding: 5px 14px;
  border-radius: var(--round);
  background: var(--paper);
  color: var(--ink);
}

/* 뒤돌아 있을 때 : 안전해요 */
.m1-police.is-away .m1-face { transform: scaleX(-1); }

/* 돌아보려고 할 때 : 부르르 떨려요 */
.m1-police.is-warning { animation: shake 0.45s ease infinite; }
.m1-police.is-warning .m1-word { background: var(--ochre); }

/* 이쪽을 볼 때 : 커지고 빨개져요 */
.m1-police.is-watching { transform: scale(1.15); }
.m1-police.is-watching .m1-word { background: var(--flag-red); color: #fff0f0; }

.m1-police.is-angry .m1-face { animation: shake 0.3s ease infinite; }

/* ---------- 신호등 글씨 ---------- */
.m1-light {
  font-size: clamp(17px, 3.4vw, 28px);
  font-weight: 900;
  padding: 8px 26px;
  border-radius: var(--round);
  transition: all 0.2s ease;
}

.m1-light.is-away     { background: var(--moss);    color: #0d1a0b; }  /* 국방색 = 달려 */
.m1-light.is-warning  { background: var(--ochre);   color: #2a1e00; }  /* 놋쇠색 = 조심 */
.m1-light.is-watching { background: var(--flag-red); color: #fff0f0; } /* 태극기 빨강 = 멈춰 */

/* ---------- 길 ---------- */
.m1-road {
  position: relative;
  width: 100%;
  height: clamp(62px, 12vh, 92px);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.13));
  border: 2px dashed rgba(255, 255, 255, 0.22);
}

/* 주인공 (왼쪽에서 오른쪽으로 가요) */
.m1-hero {
  position: absolute;
  bottom: 8px;
  left: 0;
  font-size: clamp(28px, 5.5vw, 44px);
  /* 길 안쪽으로 조금 들여서, 양 끝에서도 안 잘리게 해요 */
  margin-left: 12px;
  transform: translateX(-45%);
  transition: none;
}

/* 달릴 때 통통 튀어요 */
.m1-hero.is-running { animation: walk 0.42s steps(2) infinite; }

/* 도착 지점 (비밀 아지트) */
.m1-goal {
  position: absolute;
  right: 6px;
  bottom: 6px;
  font-size: clamp(30px, 6vw, 48px);
}

.m1-goal.is-clear { animation: pop 0.6s ease 2; }

/* ---------- 얼마나 왔는지 보여주는 막대 ---------- */
.m1-bar {
  width: 100%;
  height: 12px;
  border-radius: var(--round);
  background: rgba(255, 255, 255, 0.13);
  overflow: hidden;
}

.m1-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--round);
  background: linear-gradient(90deg, var(--blue-lit), var(--moss));
}

.m1-tip {
  font-size: clamp(10px, 1.7vw, 13px);
  opacity: 0.75;
  text-align: center;
}

/* ==================================================================
   실루엣 캐릭터
   ★ 이모지를 안 쓰고, CSS로 사람 그림자 모양을 직접 그렸어요.
     동그라미(머리) + 사다리꼴(몸) + 모자 를 겹쳐서 만들어요.

   쓰는 방법 :
     <span class="fig fig--police"><i class="f-hat"></i><i class="f-head">
       <i class="f-eyes"></i></i><i class="f-body"></i></span>

   크기는 font-size 로 조절해요. 글자 크기처럼 커지고 작아져요.
   ================================================================== */
.fig {
  position: relative;
  display: inline-block;
  width: 1.1em;
  height: 1.55em;
  color: var(--paper);        /* 실루엣 색 */
  vertical-align: bottom;
}

/* 머리 (동그라미) */
.fig .f-head {
  position: absolute;
  left: 50%;
  top: 0.06em;
  transform: translateX(-50%);
  width: 0.52em;
  height: 0.52em;
  border-radius: 50%;
  background: currentColor;
}

/* 몸 (어깨가 넓은 사다리꼴) */
.fig .f-body {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 0.9em;
  height: 0.9em;
  background: currentColor;
  border-radius: 0.36em 0.36em 0.04em 0.04em;
}

/* 눈 (뒤돌아 있을 때는 안 보이고, 이쪽을 볼 때 반짝 나타나요) */
.fig .f-eyes {
  position: absolute;
  left: 50%;
  top: 0.19em;
  transform: translateX(-50%);
  width: 0.3em;
  height: 0.08em;
  opacity: 0;
  transition: opacity 0.15s ease;
  /* 점 두 개를 그려요 */
  background:
    radial-gradient(circle at 20% 50%, var(--red-lit) 45%, transparent 46%),
    radial-gradient(circle at 80% 50%, var(--red-lit) 45%, transparent 46%);
}

.fig.is-looking .f-eyes { opacity: 1; }

/* ---------- 주인공 (짧은 머리 학생) ---------- */
.fig--hero .f-hat {
  position: absolute;
  left: 50%;
  top: 0.02em;
  transform: translateX(-50%);
  width: 0.58em;
  height: 0.26em;
  background: currentColor;
  border-radius: 0.29em 0.29em 0 0;
}

/* ---------- 일본 경찰 (챙 넓은 제모) ---------- */
.fig--police { color: #9aa3b8; }

.fig--police .f-hat {
  position: absolute;
  left: 50%;
  top: 0.26em;                /* 넓은 챙 (머리 앞으로 튀어나옴) */
  transform: translateX(-50%);
  width: 0.9em;
  height: 0.09em;
  background: currentColor;
  z-index: 2;
}

/* 모자의 윗부분 (각진 제모) */
.fig--police .f-hat::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0.07em;
  transform: translateX(-50%);
  width: 0.56em;
  height: 0.26em;
  background: currentColor;
  border-radius: 0.03em 0.03em 0 0;
}

.fig--police .f-head { top: 0.2em; }
.fig--police .f-eyes { top: 0.36em; }

/* ---------- 김구 선생님 (중절모 + 두루마기) ---------- */
.fig--kimgu { color: #cfc7b4; }

.fig--kimgu .f-hat {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 0.78em;
  height: 0.09em;
  background: currentColor;
  border-radius: 0.04em;
}

.fig--kimgu .f-hat::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0.07em;
  transform: translateX(-50%);
  width: 0.42em;
  height: 0.22em;
  background: currentColor;
  border-radius: 0.08em 0.08em 0 0;
}

.fig--kimgu .f-head { top: 0.13em; }

/* 김구 선생님의 동그란 안경 */
.fig--kimgu .f-head::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 0.2em;
  transform: translateX(-50%);
  width: 0.4em;
  height: 0.12em;
  border-radius: 0.06em;
  background:
    radial-gradient(circle at 18% 50%, var(--ink) 42%, transparent 43%),
    radial-gradient(circle at 82% 50%, var(--ink) 42%, transparent 43%);
}

/* ---------- 유관순 (댕기머리) ---------- */
.fig--yu { color: #e3dac6; }

.fig--yu .f-hat {
  position: absolute;
  left: 50%;
  top: 0.04em;
  transform: translateX(-50%);
  width: 0.64em;
  height: 0.72em;             /* 길게 늘어뜨린 머리 */
  background: currentColor;
  border-radius: 0.32em 0.32em 0.1em 0.1em;
}

/* 머리는 머리카락 위에 그려요 */
.fig--yu .f-head { z-index: 1; }

/* ---------- 독립운동가 동료 (갓 쓴 어른) ---------- */
.fig--mate { color: #c3bba8; }

.fig--mate .f-hat {
  position: absolute;
  left: 50%;
  top: 0.02em;
  transform: translateX(-50%);
  width: 0.98em;              /* 갓은 챙이 가장 넓어요 */
  height: 0.08em;
  background: currentColor;
  border-radius: 0.04em;
}

.fig--mate .f-hat::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0.06em;
  transform: translateX(-50%);
  width: 0.34em;
  height: 0.24em;
  background: currentColor;
  border-radius: 0.06em 0.06em 0 0;
}

.fig--mate .f-head { top: 0.14em; }

/* ---------- 일본 헌병대장 (별이 달린 전투모) ---------- */
.fig--captain { color: #8c93a8; }

.fig--captain .f-hat {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 0.72em;
  height: 0.26em;
  background: currentColor;
  border-radius: 0.1em 0.1em 0 0;
}

/* 모자에 붙은 붉은 별 */
.fig--captain .f-hat::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 0.09em;
  transform: translateX(-50%);
  width: 0.1em;
  height: 0.1em;
  background: var(--flag-red);
  border-radius: 50%;
}

.fig--captain .f-head { top: 0.2em; }

/* ---------- 걸을 때 살짝 흔들려요 (통통 튀지 않아요) ---------- */
@keyframes walk {
  0%, 100% { transform: translateX(-45%) translateY(0); }
  50%      { transform: translateX(-45%) translateY(-2px); }
}

/* ==================================================================
   목숨 표시 (하트 대신 각진 표식)
   ================================================================== */
#hud-hearts { display: inline-flex; gap: 5px; }

.life-mark {
  width: 13px;
  height: 13px;
  background: var(--flag-red);
  transform: rotate(45deg);      /* 마름모 모양 */
  transition: background 0.3s ease;
}

.life-mark.is-lost { background: rgba(222, 213, 194, 0.18); }

/* ==================================================================
   1장 미션에 새로 필요한 것들
   ================================================================== */

/* 실루엣 캐릭터 크기를 정해줘요 */
.m1-police .m1-face { font-size: clamp(38px, 7vw, 58px); }
.m1-hero .fig       { font-size: clamp(26px, 5vw, 40px); }

/* 뒤돌아 있을 때는 조금 흐릿하게 (어둠 속에 있는 느낌) */
.m1-police.is-away .fig { opacity: 0.55; }

/* 돌아보려 할 때는 살짝 밝아져요 */
.m1-police.is-warning .fig { opacity: 0.8; }

/* 이쪽을 볼 때는 또렷하게 */
.m1-police.is-watching .fig { opacity: 1; }

/* 들켰을 때 주인공이 붉게 물들어요 */
.m1-hero.is-caught .fig { color: var(--flag-red); }

/* ---------- 비밀 아지트 (한옥 대문 모양) ---------- */
.m1-goal {
  position: absolute;
  right: 10px;
  bottom: 6px;
  width: clamp(30px, 5.5vw, 44px);
  height: clamp(38px, 7vw, 56px);
  /* 문짝 : 위가 둥근 기와지붕 아래 두 짝 문 */
  background: rgba(222, 213, 194, 0.22);
  border: 2px solid var(--line);
  border-bottom: none;
  transition: all 0.4s ease;
}

/* 기와지붕 */
.m1-goal::before {
  content: '';
  position: absolute;
  left: -18%;
  top: -9px;
  width: 136%;
  height: 9px;
  background: var(--paper-dim);
}

/* 문 가운데 선 */
.m1-goal::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 12%;
  width: 2px;
  height: 88%;
  background: var(--line);
}

/* 도착하면 문이 열린 듯 밝아져요 */
.m1-goal.is-clear {
  background: var(--ochre);
  border-color: var(--ochre);
  box-shadow: 0 0 30px rgba(200, 162, 90, 0.7);
}

/* ---------- 경찰이 화났을 때 ---------- */
.m1-police.is-angry { animation: shake 0.3s ease 2; }

/* ==================================================================
   2장 · 김구 선생님과의 만남 (역사 퀴즈)
   ================================================================== */
.m2-scene {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  gap: clamp(10px, 2.5vw, 26px);
  padding: clamp(10px, 2vw, 20px);
}

/* ---------- 왼쪽 : 김구 선생님 ---------- */
.m2-person {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.m2-person .fig { font-size: clamp(46px, 8vw, 74px); }

.m2-name {
  font-size: clamp(10px, 1.6vw, 13px);
  letter-spacing: 3px;
  color: var(--paper-dim);
  padding-top: 6px;
  border-top: 1px solid var(--line);
}

/* ---------- 오른쪽 : 문제판 ---------- */
.m2-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(7px, 1.4vh, 13px);
}

.m2-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}

.m2-label {
  font-size: clamp(10px, 1.5vw, 12px);
  letter-spacing: 4px;
  color: var(--ochre);
}

.m2-count {
  font-size: clamp(11px, 1.7vw, 14px);
  color: var(--paper-dim);
}

.m2-question {
  font-size: clamp(14px, 2.4vw, 21px);
  font-weight: 700;
  line-height: 1.55;
}

/* ---------- 보기 3개 ---------- */
.m2-choices {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.m2-choice {
  font-family: inherit;
  font-size: clamp(12px, 2vw, 17px);
  color: var(--paper);
  text-align: left;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: clamp(8px, 1.4vh, 13px) 15px;
  border: 2px solid var(--line);
  border-radius: var(--round);
  background: rgba(255, 255, 255, 0.04);
  cursor: pointer;
  transition: all 0.12s ease;
}

/* 지금 고르고 있는 보기 */
.m2-choice.is-on {
  border-color: var(--ochre);
  background: rgba(200, 162, 90, 0.14);
}

.m2-num {
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--round);
  background: var(--line);
  font-size: 11px;
  font-weight: 800;
}

.m2-choice.is-on .m2-num { background: var(--ochre); color: var(--ink); }

/* 맞았을 때 / 틀렸을 때 */
.m2-choice.is-right {
  border-color: var(--moss);
  background: rgba(111, 143, 106, 0.3);
}

.m2-choice.is-wrong {
  border-color: var(--flag-red);
  background: rgba(205, 46, 58, 0.25);
}

/* 틀렸을 때 진짜 정답을 알려줘요 */
.m2-choice.is-answer {
  border-color: var(--ochre);
  border-style: dashed;
}

/* ---------- 김구 선생님의 말 ---------- */
.m2-talk {
  font-size: clamp(11px, 1.8vw, 15px);
  line-height: 1.6;
  min-height: 1.6em;
}

.m2-talk.is-right { color: var(--moss); font-weight: 700; }
.m2-talk.is-wrong { color: var(--ochre); }

.m2-tip {
  font-size: clamp(9px, 1.4vw, 12px);
  color: var(--paper-dim);
}

/* 화면이 좁으면 김구 선생님을 위로 올려요 */
@media (max-width: 620px) {
  .m2-scene { flex-direction: column; align-items: stretch; }
  .m2-person { flex-direction: row; justify-content: center; gap: 12px; }
  .m2-name { border-top: none; padding-top: 0; }
}

/* ==================================================================
   3장 · 태극기 지키기 (미로)
   ================================================================== */
.m3-scene {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.4vh, 12px);
  padding: clamp(8px, 1.6vw, 16px);
}

.m3-notice {
  font-size: clamp(11px, 1.9vw, 16px);
  font-weight: 700;
  text-align: center;
  min-height: 1.4em;
}

.m3-notice.is-good { color: var(--ochre); }
.m3-notice.is-bad  { color: var(--flag-red); }

/* ---------- 미로판 ----------
   가로 15칸 × 세로 9칸 이라서 3:1.8 비율로 만들어요 */
.m3-maze {
  position: relative;
  width: 100%;
  max-width: 860px;
  aspect-ratio: 21 / 13;
  background: rgba(0, 0, 0, 0.3);
  border: 2px solid var(--line);
  overflow: hidden;
}

/* 미로 안의 모든 칸은 크기가 같아요 (가로 1/15, 세로 1/9) */
/* 칸 하나의 크기는 미로 크기에 따라 저절로 정해져요
   (--cols 와 --rows 는 자바스크립트가 넣어줘요) */
.m3-wall,
.m3-danger,
.m3-item,
.m3-actor {
  position: absolute;
  width: calc(100% / var(--cols, 21));
  height: calc(100% / var(--rows, 13));
}

/* 벽 */
.m3-wall { background: rgba(222, 213, 194, 0.13); }

/* 보초의 경계 구역 (여기 들어가면 들켜요!) */
.m3-danger {
  background: rgba(205, 46, 58, 0.28);
  border: 1px solid rgba(205, 46, 58, 0.5);
}

/* ---------- 태극기 ---------- */
.m3-flagcell::after {
  content: '';
  position: absolute;
  left: 18%; top: 24%;
  width: 64%; height: 46%;
  background: #f2ede2;
  /* 가운데 작은 태극 무늬 */
  background-image:
    linear-gradient(160deg, var(--flag-red) 50%, var(--flag-blue) 50%);
  background-size: 52% 52%;
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: 0 0 12px rgba(242, 237, 226, 0.5);
}

/* 태극기를 주우면 그 자리는 비어요 */
.m3-flagcell.is-taken::after { opacity: 0; }

/* ---------- 안전한 곳 ---------- */
.m3-safecell::after {
  content: '';
  position: absolute;
  left: 22%; top: 22%;
  width: 56%; height: 56%;
  border: 2px dashed var(--paper-dim);
  opacity: 0.45;
}

/* 태극기를 주우면 안전한 곳이 밝게 빛나요 */
.m3-safecell.is-active::after {
  border-color: var(--ochre);
  background: rgba(200, 162, 90, 0.25);
  opacity: 1;
}

/* ---------- 사람들 ---------- */
.m3-actor {
  display: grid;
  place-items: center;
  z-index: 3;
}

.m3-actor .fig { font-size: clamp(11px, 2.4vw, 20px); }

/* 주인공은 부드럽게 미끄러지듯 움직여요 */
.m3-hero {
  transition: left 0.12s linear, top 0.12s linear;
  z-index: 5;
}

.m3-hero .fig { color: var(--paper); }

/* 태극기를 들면 표시가 나요 */
.m3-hero.has-flag::after {
  content: '';
  position: absolute;
  right: 6%; top: 4%;
  width: 34%; height: 26%;
  background: #f2ede2;
  background-image: linear-gradient(160deg, var(--flag-red) 50%, var(--flag-blue) 50%);
  background-size: 56% 56%;
  background-position: center;
  background-repeat: no-repeat;
}

/* 들켰을 때 주인공이 붉게 물들어요 */
.m3-hero.is-caught .fig { color: var(--flag-red); }

/* 순찰 경찰 : 천천히 미끄러지듯 */
.m3-cop { transition: left 0.38s linear, top 0.38s linear; }
.m3-cop .fig { color: #9aa3b8; }

/* 보초 경찰 : 가만히 서 있고 눈이 늘 켜져 있어요 */
.m3-guard .fig { color: #b9505c; }

/* ---------- 아래쪽 설명 ---------- */
.m3-tip {
  font-size: clamp(9px, 1.4vw, 12px);
  color: var(--paper-dim);
  text-align: center;
}

.m3-key {
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: var(--round);
}

/* 설명에 쓰는 작은 색 네모 */
.m3-legend {
  display: inline-block;
  width: 9px; height: 9px;
  vertical-align: middle;
}

.m3-legend-guard { background: rgba(205, 46, 58, 0.55); }
.m3-legend-cop   { background: #9aa3b8; }

/* ==================================================================
   4장 · 만세운동 준비 (태극기 나누어 주기)
   ================================================================== */
.m4-scene {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: clamp(5px, 1.2vh, 10px);
  padding: clamp(8px, 1.6vw, 16px);
}

/* ---------- 위쪽 : 남은 태극기 ---------- */
.m4-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}

.m4-count { display: inline-flex; gap: 5px; }

/* 남은 태극기 한 장 */
.m4-flagmark {
  width: 18px;
  height: 12px;
  background: #f2ede2;
  background-image: linear-gradient(160deg, var(--flag-red) 50%, var(--flag-blue) 50%);
  background-size: 52% 78%;
  background-position: center;
  background-repeat: no-repeat;
  transition: opacity 0.3s ease;
}

/* 이미 나눠준 태극기는 흐려져요 */
.m4-flagmark.is-used { opacity: 0.16; }

.m4-count-text {
  font-size: clamp(10px, 1.6vw, 13px);
  color: var(--paper-dim);
}

/* ---------- 가운데 : 광장 ---------- */
.m4-field {
  position: relative;
  flex: 1;
  min-height: 0;
  border: 2px solid var(--line);
  /* 광장 바닥에 흙길 느낌의 은은한 무늬를 깔아요 */
  background:
    radial-gradient(ellipse at 50% 50%, rgba(200, 162, 90, 0.07), transparent 70%),
    rgba(0, 0, 0, 0.28);
  overflow: hidden;
  transition: background 0.8s ease;
}

/* 다섯 명 모두에게 나눠주면 광장이 환해져요 */
.m4-field.is-ready {
  background:
    radial-gradient(ellipse at 50% 50%, rgba(200, 162, 90, 0.3), transparent 75%),
    rgba(0, 0, 0, 0.28);
}

/* ---------- 광장에 서 있는 사람들 ---------- */
.m4-person,
.m4-yu,
.m4-hero {
  position: absolute;
  transform: translate(-50%, -50%);   /* 자리의 한가운데에 놓여요 */
  display: flex;
  flex-direction: column;
  align-items: center;
}

.m4-person .fig,
.m4-yu .fig { font-size: clamp(17px, 3vw, 27px); }

.m4-hero .fig {
  font-size: clamp(19px, 3.3vw, 30px);
  color: var(--paper);
}

/* 유관순 이름표 */
.m4-name {
  font-size: clamp(8px, 1.2vw, 10px);
  letter-spacing: 2px;
  color: var(--ochre);
  margin-top: 3px;
}

/* 말을 걸 수 있을 때 머리 위에 뜨는 '2' 표시 */
.m4-bubble {
  position: absolute;
  top: -1.5em;
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink);
  background: var(--ochre);
  border-radius: var(--round);
  opacity: 0;
  transition: opacity 0.15s ease;
}

.m4-person.is-near .m4-bubble { opacity: 1; }

/* 곁에 다가가면 그 사람이 밝아져요 */
.m4-person.is-near .fig { color: var(--ochre); }

/* 태극기를 받으면 손에 깃발이 생겨요 */
.m4-gotflag {
  position: absolute;
  right: -0.3em;
  top: 0;
  width: 14px;
  height: 10px;
  background: #f2ede2;
  background-image: linear-gradient(160deg, var(--flag-red) 50%, var(--flag-blue) 50%);
  background-size: 52% 78%;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.m4-person.is-done .m4-gotflag { opacity: 1; }
.m4-person.is-done .fig { color: var(--paper); }

/* 마우스로 눌러도 되니까 손가락 모양이 나와요 */
.m4-person { cursor: pointer; }

/* ---------- 아래쪽 : 말과 설명 ---------- */
.m4-talk {
  font-size: clamp(11px, 1.9vw, 16px);
  line-height: 1.5;
  min-height: 1.5em;
  text-align: center;
}

.m4-talk.is-good { color: var(--ochre); font-weight: 700; }

.m4-tip {
  font-size: clamp(9px, 1.4vw, 12px);
  color: var(--paper-dim);
  text-align: center;
}

/* 주인공이 누구인지 헷갈리지 않게 발밑에 표시를 넣어요 */
.m4-hero::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 1.7em;
  height: 4px;
  background: var(--ochre);
}

.m4-hero { z-index: 4; }

/* ==================================================================
   5장 · 독립을 향하여 (일본 헌병대장과의 마지막 싸움)
   ================================================================== */
.m5-scene {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: clamp(5px, 1.2vh, 10px);
  padding: clamp(8px, 1.6vw, 16px);
}

/* ---------- 위쪽 : 양쪽 기력 막대 ---------- */
.m5-bars {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}

.m5-side { display: flex; align-items: center; gap: 9px; }

.m5-who {
  font-size: clamp(9px, 1.4vw, 12px);
  letter-spacing: 2px;
  color: var(--paper-dim);
}

.m5-hp { display: inline-flex; gap: 4px; }

/* 기력 한 칸 */
.m5-pip {
  width: 15px;
  height: 11px;
  background: var(--flag-red);
  transition: background 0.25s ease;
}

.m5-pip.is-mine { background: var(--ochre); }   /* 주인공 기력은 놋쇠색 */
.m5-pip.is-lost { background: rgba(222, 213, 194, 0.14); }

/* ---------- 가운데 : 싸움터 ---------- */
.m5-arena {
  position: relative;
  flex: 1;
  min-height: 0;
  border: 2px solid var(--line);
  background:
    radial-gradient(ellipse at 50% 90%, rgba(205, 46, 58, 0.12), transparent 65%),
    rgba(0, 0, 0, 0.3);
  overflow: hidden;
  cursor: pointer;
}

/* 바닥 선 */
.m5-ground {
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: 16%;
  height: 2px;
  background: var(--line);
}

/* ---------- 알림 글씨 (준비 / 공격 / 빈틈) ---------- */
.m5-signal {
  position: absolute;
  left: 50%;
  top: 10%;
  transform: translateX(-50%);
  font-size: clamp(13px, 2.4vw, 21px);
  font-weight: 800;
  letter-spacing: 2px;
  padding: 7px 20px;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.m5-signal.is-idle   { color: var(--paper-dim); }
.m5-signal.is-ready  { background: var(--ochre);    color: var(--ink); }
.m5-signal.is-strike { background: var(--flag-red); color: #fff0f0; }
.m5-signal.is-open   { background: var(--moss);     color: #0d1a0b; }

/* ---------- 주인공 (왼쪽) ---------- */
.m5-hero {
  position: absolute;
  left: 22%;
  bottom: 16%;
  transform: translateX(-50%);
  transition: bottom 0.16s ease;
}

.m5-hero .fig {
  font-size: clamp(34px, 6.5vw, 58px);
  color: var(--paper);
  transition: color 0.15s ease;
}

/* 점프하면 위로 올라가요 */
.m5-hero.is-jumping { bottom: 40%; }

/* 헛손질하면 굳어서 흐려져요 */
.m5-hero.is-stiff .fig { color: var(--paper-dim); }

/* 맞으면 붉게 번쩍여요 */
.m5-hero.is-hurt .fig { color: var(--flag-red); }

/* ---------- 일본 헌병대장 (오른쪽) ---------- */
.m5-boss {
  position: absolute;
  right: 22%;
  bottom: 16%;
  transform: translateX(50%);
  transition: transform 0.15s ease, opacity 0.5s ease;
}

.m5-boss .fig {
  font-size: clamp(40px, 7.5vw, 68px);
  transition: color 0.15s ease;
}

/* 준비 자세 : 살짝 뒤로 젖혀요 */
.m5-boss.is-ready { transform: translateX(50%) rotate(6deg); }

/* 공격 : 앞으로 확 숙여요 */
.m5-boss.is-strike { transform: translateX(50%) translateX(-14px) rotate(-10deg); }

/* 빈틈 : 자세가 무너져요 */
.m5-boss.is-open { transform: translateX(50%) rotate(-4deg); opacity: 0.75; }

.m5-boss.is-hurt .fig { color: var(--flag-red); }

/* 쓰러지면 옆으로 넘어가요 */
.m5-boss.is-down {
  transform: translateX(50%) rotate(80deg);
  opacity: 0.3;
}

/* ---------- 헌병대장의 칼 ---------- */
.m5-blade {
  position: absolute;
  left: -0.5em;
  top: 0.1em;
  width: 3px;
  height: 1.1em;
  background: var(--paper-dim);
  transform-origin: bottom center;
  opacity: 0;
  transition: all 0.14s ease;
}

/* 준비할 때 칼을 들어올려요 */
.m5-boss.is-ready .m5-blade {
  opacity: 1;
  transform: rotate(-40deg);
  background: var(--ochre);
}

/* 공격할 때 칼을 내려쳐요 */
.m5-boss.is-strike .m5-blade {
  opacity: 1;
  transform: rotate(55deg) scaleY(1.35);
  background: var(--flag-red);
}

/* ---------- 아래쪽 말과 설명 ---------- */
.m5-talk {
  font-size: clamp(11px, 1.9vw, 16px);
  text-align: center;
  min-height: 1.5em;
}

.m5-talk.is-good { color: var(--ochre); font-weight: 700; }
.m5-talk.is-bad  { color: var(--flag-red); }

.m5-tip {
  font-size: clamp(9px, 1.4vw, 12px);
  color: var(--paper-dim);
  text-align: center;
}

/* ==================================================================
   6장 · 광복의 날
   ★ --dawn 이라는 숫자(0~1)가 커질수록 하늘이 밝아져요.
     태극기를 흔들 때마다 이 숫자가 커져요!
   ================================================================== */
.m6-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: clamp(5px, 1.2vh, 10px);
  padding: clamp(10px, 2vw, 18px);
}

/* ---------- 하늘 (밤 → 새벽) ---------- */
.m6-sky {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(180deg, #0a0f22 0%, #16203f 60%, #24304f 100%);
}

/* 밝아진 만큼 새벽빛이 겹쳐 올라와요 */
.m6-sky::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #7fa8d8 0%, #e8c98a 62%, #f4dcae 100%);
  opacity: var(--dawn);
  transition: opacity 0.25s ease;
}

/* ---------- 떠오르는 해 ---------- */
.m6-sun {
  position: absolute;
  left: 50%;
  z-index: 1;
  width: clamp(52px, 9vw, 92px);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: radial-gradient(circle, #fff3d0 30%, #f0b45a 70%, rgba(240,180,90,0) 72%);
  /* 밝아질수록 위로 떠올라요 */
  bottom: calc(14% + var(--dawn) * 30%);
  transform: translateX(-50%);
  opacity: calc(var(--dawn) * 1.1);
  transition: bottom 0.3s ease, opacity 0.3s ease;
}

/* ---------- 땅 ---------- */
.m6-ground {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 2;
  height: 24%;
  background: #05070f;
}

/* ---------- 사람들 ----------
   해를 등지고 서 있어서 검은 실루엣으로 보여요 */
.m6-crowd {
  position: absolute;
  left: 0; right: 0;
  bottom: 22%;
  z-index: 3;
  height: 0;
}

.m6-person {
  position: absolute;
  bottom: 0;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
}

.m6-person .fig {
  font-size: calc(clamp(30px, 5.6vw, 52px) * var(--size));
  /* 하늘이 밝아질수록 더 까만 실루엣이 돼요 */
  color: #05070f;
  transition: color 0.4s ease;
}

/* ---------- 사람들이 든 태극기 ---------- */
.m6-flag {
  position: absolute;
  left: 62%;
  bottom: 68%;
  width: clamp(15px, 2.6vw, 24px);
  height: clamp(10px, 1.8vw, 16px);
  background: #f2ede2;
  background-image: linear-gradient(160deg, var(--flag-red) 50%, var(--flag-blue) 50%);
  background-size: 52% 78%;
  background-position: center;
  background-repeat: no-repeat;
  transform-origin: left bottom;
  /* 깃대 */
  border-left: 2px solid #05070f;
}

/* 흔들 때마다 태극기가 펄럭여요 */
.m6-scene.is-waving .m6-flag { animation: flagwave 0.34s ease; }

@keyframes flagwave {
  0%   { transform: rotate(0deg) scaleX(1); }
  35%  { transform: rotate(-16deg) scaleX(0.86); }
  70%  { transform: rotate(11deg) scaleX(1.06); }
  100% { transform: rotate(0deg) scaleX(1); }
}

/* 광복이 이루어지면 모든 태극기가 계속 펄럭여요 */
.m6-scene.is-free .m6-flag { animation: flagwave 0.7s ease infinite; }

/* ---------- 이야기 자막 ---------- */
.m6-story {
  position: relative;
  z-index: 5;
  font-size: clamp(13px, 2.3vw, 20px);
  font-weight: 700;
  text-align: center;
  color: #f4ecd8;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
  min-height: 1.6em;
}

.m6-story.is-in { animation: storyIn 0.6s ease; }

@keyframes storyIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 마지막 "대한 독립 만세!" 는 크게 보여요 */
.m6-story.is-big {
  font-size: clamp(20px, 4.2vw, 38px);
  letter-spacing: 4px;
  color: #fff8e8;
}

.m6-hint {
  position: relative;
  z-index: 5;
  font-size: clamp(9px, 1.4vw, 12px);
  color: rgba(244, 236, 216, 0.72);
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  text-align: center;
  min-height: 1.3em;
}

/* ---------- 밝기 게이지 ---------- */
.m6-gauge {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 420px;
  height: 10px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(244, 236, 216, 0.3);
}

.m6-gauge-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--flag-blue), var(--ochre), #fff3d0);
  transition: width 0.2s ease;
}

/* ==================================================================
   광복(밝은 화면)일 때 손보기
   ★ 배경이 밝아지면, 어두운 배경에 맞춰 만든 반투명 상자들이
     잘 안 보여요. 그래서 밝은 화면일 때는 따로 색을 정해줘요.
   ================================================================== */

/* 화면 가장자리를 어둡게 하던 효과를 약하게 해요 */
body.liberation .screen {
  background:
    radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(90, 110, 150, 0.28) 100%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
}

/* 점수판 */
body.liberation #hud { background: rgba(255, 255, 255, 0.42); }

body.liberation .hud-chapter,
body.liberation .hud-score,
body.liberation .hud-life {
  background: rgba(255, 255, 255, 0.72);
  border-color: rgba(26, 35, 64, 0.18);
}

body.liberation #hud-chapter-name { color: var(--flag-blue); }
body.liberation #hud-score { color: #8a6420; }

/* 게임 무대 */
body.liberation #stage-inner {
  background: rgba(255, 255, 255, 0.4);
  border-color: rgba(26, 35, 64, 0.16);
}

/* 말풍선은 밝은 화면에서 반대로 어둡게 해서 잘 보이게 해요 */
body.liberation #bubble {
  background: #1a2340;
  color: #f0e9d8;
  border-left-color: var(--flag-red);
}

/* 조작 안내판 */
body.liberation #pad-guide {
  background: rgba(255, 255, 255, 0.5);
  border-color: rgba(26, 35, 64, 0.16);
}

body.liberation .pad-btn,
body.liberation .pad-stick {
  background: rgba(255, 255, 255, 0.78);
  border-color: rgba(26, 35, 64, 0.16);
}

body.liberation .pad-no,
body.liberation .pad-arrows b {
  background: rgba(26, 35, 64, 0.14);
}

body.liberation .pad-device { background: rgba(255, 255, 255, 0.6); }

/* 끝 화면의 점수 상자 */
body.liberation .score-card {
  background: rgba(255, 255, 255, 0.72);
  border-color: rgba(26, 35, 64, 0.18);
}

body.liberation .score-card strong { color: #8a6420; }
body.liberation #end-emoji { color: #8a6420; }

/* 덮개 화면은 밝은 화면에서도 어둡게 두어 잘 보이게 해요 */
body.liberation .overlay-card { color: #f0e9d8; }
body.liberation .overlay-card .help-row .no { color: #1a2340; }

/* ==================================================================
   조종기 확인 화면
   ================================================================== */
.corner-test {
  position: absolute;
  right: clamp(14px, 3vw, 34px);
  top: clamp(14px, 3vh, 26px);
  font-family: inherit;
  font-size: clamp(10px, 1.5vw, 13px);
  letter-spacing: 1px;
  color: var(--paper-dim);
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--round);
  cursor: pointer;
  transition: all 0.15s ease;
}

.corner-test:hover { color: var(--ochre); border-color: var(--ochre); }

.pad-test { font-size: 12px; }

.pt-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
}

.pt-label {
  flex: none;
  width: 42px;
  color: var(--ochre);
  font-size: 11px;
  letter-spacing: 2px;
}

.pt-value {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  word-break: break-all;
}

/* 방향 · 버튼 표시 (눌리면 불이 들어와요) */
.pt-dir, .pt-btn {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  border: 1px solid var(--line);
  border-radius: var(--round);
  transition: all 0.08s ease;
}

.pt-dir.is-on, .pt-btn.is-on {
  background: var(--ochre);
  color: var(--ink);
  border-color: var(--ochre);
}

/* 축(스틱) 값 */
.pt-axes { font-family: ui-monospace, Menlo, Consolas, monospace; }

.pt-axis {
  padding: 3px 7px;
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: var(--round);
}

.pt-axis.is-on { background: var(--flag-red); border-color: var(--flag-red); color: #fff0f0; }

  text-align: center;

  justify-content: center;
  min-height: clamp(76px, 15vh, 116px);

  margin-top: 4px;
  font-size: clamp(8px, 1.2vw, 10px);

}

.m1-cops .m1-police { animation: copIn 0.5s ease; }

@keyframes copIn {
  from { opacity: 0; transform: translateY(-14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 두 번째 경찰이 왔을 때 뜨는 알림 */

<!-- ================================================================
     이 게임은 화면이 3개예요.
     1) 시작 화면  2) 게임 화면  3) 끝 화면

<div id="app">

    <!-- 오른쪽 위 : 조종기 확인

    <!-- 오른쪽 아래 : 태극기 (CSS로 직접 그렸어요) -->

      <div class="taegeukgi" aria-label="태극기">
        <div class="taegeuk"></div>
        <span class="gwe gwe1"></span>
        <span class="gwe gwe2"></span>

      </div>
    </div>

  </section>


  <!-- ============ 2) 게임 화면 ============ -->

      <div class="hud-chapter">

        <!-- 각 장의 미션이 여기에 들어와요 (아직 만드는 중이에요) -->

    <!-- ---- 조작 안내판 ----

    </div>

  <!-- ============ 덮개 화면 ============

  <!-- 화면을 크게/작게 했을 때 잠깐 뜨는 알림이에요 -->

<script>
/* ===== js/sound.js ===== */
/* ==================================================================
   독립을 향하여 - 소리 담당 파일 (sound.js)

   ★ 소리 파일(mp3)을 하나도 안 써요!
     컴퓨터한테 "이런 높이의 소리를 이만큼 내줘"라고 부탁해서
     그 자리에서 소리를 만들어내요. 이걸 Web Audio 라고 해요.

   만드는 소리
   - 뽁   : 버튼을 누를 때
   - 띠링 : 점수가 오를 때
   - 뿅   : 실패했을 때
   - 배경음악 : 잔잔하게 계속 흐르는 음악
   ================================================================== */

const Sound = (function () {

  /* ----------------------------------------------------------------
     1. 소리 크기 단계
        5번 버튼을 누를 때마다 이 순서대로 바뀌어요.
     ---------------------------------------------------------------- */
  const LEVELS = [
    { value: 0.0, label: '소리 꺼짐', icon: '□□□' },
    { value: 0.3, label: '소리 작게', icon: '■□□' },
    { value: 0.6, label: '소리 보통', icon: '■■□' },
    { value: 1.0, label: '소리 크게', icon: '■■■' },
  ];

  let levelIndex = 2;      // 처음에는 '보통'으로 시작해요

  let ctx = null;          // 소리를 만드는 기계 (처음 눌렀을 때 켜져요)
  let master = null;       // 전체 소리 크기를 조절하는 손잡이
  let bgmGain = null;      // 배경음악만 따로 조절하는 손잡이
  let bgmTimer = null;     // 배경음악을 계속 이어주는 시계


  /* ----------------------------------------------------------------
     2. 소리 기계 켜기
        브라우저 규칙 때문에, 사용자가 버튼을 한 번 눌러야
        소리를 낼 수 있어요. 그래서 필요할 때 켜요.
     ---------------------------------------------------------------- */
  function wake() {
    if (!ctx) {
      const Maker = window.AudioContext || window.webkitAudioContext;
      if (!Maker) return false;        // 아주 오래된 브라우저면 소리 없이 진행해요

      ctx = new Maker();

      master = ctx.createGain();       // 전체 소리 크기 손잡이
      master.gain.value = LEVELS[levelIndex].value;
      master.connect(ctx.destination);

      bgmGain = ctx.createGain();      // 배경음악은 효과음보다 작게
      bgmGain.gain.value = 0.28;
      bgmGain.connect(master);
    }

    // 잠들어 있으면 깨워요
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }


  /* ----------------------------------------------------------------
     3. 소리 하나를 내는 기본 도구
        freq  : 소리의 높이 (숫자가 클수록 높은 소리)
        dur   : 소리의 길이 (초)
        type  : 소리의 느낌 ('sine'=부드러움, 'square'=또렷함)
        when  : 몇 초 뒤에 낼지
        to    : 어디로 보낼지 (안 적으면 효과음으로)
     ---------------------------------------------------------------- */
  function tone(freq, dur, type, when, to, peak) {
    if (!ctx) return;

    const start = ctx.currentTime + (when || 0);

    const osc = ctx.createOscillator();   // 소리를 만드는 부분
    const gain = ctx.createGain();        // 소리 크기를 다루는 부분

    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, start);

    // 소리가 갑자기 '툭' 끊기면 지직거려요.
    // 그래서 부드럽게 커졌다가 부드럽게 사라지게 해요.
    const top = peak || 0.32;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(top, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);

    osc.connect(gain);
    gain.connect(to || master);

    osc.start(start);
    osc.stop(start + dur + 0.03);
  }


  /* ----------------------------------------------------------------
     4. 게임에서 쓰는 소리들
     ---------------------------------------------------------------- */

  /* 뽁! - 버튼을 누를 때 나는 짧고 귀여운 소리 */
  function pok() {
    if (!wake()) return;
    tone(680, 0.07, 'square', 0, null, 0.18);
    tone(980, 0.05, 'square', 0.05, null, 0.13);
  }

  /* 띠링! - 점수가 오를 때 나는 기분 좋은 소리 (낮은음 → 높은음) */
  function ding() {
    if (!wake()) return;
    tone(880, 0.12, 'sine', 0,    null, 0.3);   // 라
    tone(1318, 0.20, 'sine', 0.1, null, 0.3);   // 높은 미
  }

  /* 뿅... - 실패했을 때 나는 시무룩한 소리 (높은음 → 낮은음) */
  function ppyong() {
    if (!wake()) return;
    tone(420, 0.16, 'triangle', 0,    null, 0.3);
    tone(260, 0.28, 'triangle', 0.14, null, 0.3);
  }

  /* 삐빅! - 경찰이 돌아볼 때 나는 조심하라는 소리 */
  function alert() {
    if (!wake()) return;
    tone(760, 0.09, 'square', 0,    null, 0.22);
    tone(760, 0.09, 'square', 0.13, null, 0.22);
  }

  /* 짜잔! - 광복을 맞이했을 때 나는 축하 소리 */
  function fanfare() {
    if (!wake()) return;
    const notes = [523, 659, 784, 1047];   // 도-미-솔-높은도
    notes.forEach(function (f, i) {
      tone(f, 0.3, 'sine', i * 0.12, null, 0.32);
    });
  }


  /* ----------------------------------------------------------------
     5. 잔잔한 배경음악
        낮은 음 몇 개를 천천히 반복해서 연주해요.
        '도-레-미-솔-라' 다섯 음만 써서 어떻게 이어져도
        듣기 좋은 소리가 나요. (이걸 5음 음계라고 해요)
     ---------------------------------------------------------------- */
  const MELODY = [
    262, 294, 330, 392, 440,   // 도 레 미 솔 라
    392, 330, 294, 262, 220,   // 솔 미 레 도 라(낮은)
  ];

  let melodyStep = 0;

  function playBgmNote() {
    if (!ctx) return;

    const note = MELODY[melodyStep % MELODY.length];

    tone(note, 1.6, 'sine', 0, bgmGain, 0.22);          // 멜로디
    tone(note / 2, 2.2, 'triangle', 0, bgmGain, 0.12);  // 낮은 화음을 살짝 겹쳐요

    melodyStep += 1;
  }

  /* 배경음악을 켜요 */
  function startBgm() {
    if (!wake()) return;
    if (bgmTimer) return;             // 이미 켜져 있으면 그냥 둬요

    playBgmNote();
    bgmTimer = setInterval(playBgmNote, 900);   // 0.9초마다 한 음씩
  }

  /* 배경음악을 꺼요 */
  function stopBgm() {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }


  /* ----------------------------------------------------------------
     6. 소리 크기 조절 (5번 버튼이 쓰는 기능)
     ---------------------------------------------------------------- */

  /* 다음 단계로 소리 크기를 바꿔요.
     꺼짐 → 작게 → 보통 → 크게 → 다시 꺼짐 ... */
  function cycleVolume() {
    levelIndex = (levelIndex + 1) % LEVELS.length;
    applyVolume();
    return LEVELS[levelIndex];        // 지금 단계를 알려줘요 (화면에 표시하려고)
  }

  /* 지금 정해진 크기를 실제 소리에 적용해요 */
  function applyVolume() {
    const level = LEVELS[levelIndex];

    if (level.value > 0) {
      wake();                          // 소리를 켜야 하면 기계를 깨워요
      if (master) master.gain.value = level.value;
      startBgm();
    } else {
      if (master) master.gain.value = 0;
      stopBgm();                       // 꺼짐이면 배경음악도 멈춰요
    }
  }


  /* ----------------------------------------------------------------
     7. 다른 파일에서 쓸 수 있게 열어둬요
     ---------------------------------------------------------------- */
  return {
    pok: pok,
    ding: ding,
    ppyong: ppyong,
    alert: alert,
    fanfare: fanfare,

    startBgm: startBgm,
    stopBgm: stopBgm,

    cycleVolume: cycleVolume,
    level: function () { return LEVELS[levelIndex]; },
    isOn:  function () { return LEVELS[levelIndex].value > 0; },

    /* 사용자가 처음 화면을 눌렀을 때 소리 기계를 깨워요 */
    wake: wake,
  };
})();


/* ===== js/input.js ===== */
/* ==================================================================
   독립을 향하여 - 조작 담당 파일 (input.js)

   이 게임은 세 가지 방법으로 조작할 수 있어요.
   1) 키보드         : 방향키 + 정해진 글자키
   2) 마우스         : 화면을 눌러서
   3) 아케이드 조종기 : 방향 스틱 1개 + 버튼 8개

   ★ 아케이드 조종기는 컴퓨터가 '키보드'로 알아볼 때도 있고
     '게임패드'로 알아볼 때도 있어요.
     그래서 두 가지를 모두 알아듣게 만들었어요!
   ================================================================== */

const Input = (function () {

  /* ----------------------------------------------------------------
     1. 버튼 8개의 정보표
     ----------------------------------------------------------------
     no    : 조종기에 적힌 버튼 번호 (1~8)
     act   : 게임에서 하는 일의 이름
     label : 화면 안내판에 보여줄 글자
     emoji : 화면 안내판에 보여줄 그림
     keys  : 키보드로 눌렀을 때 이 버튼과 같은 것으로 쳐주는 키들

     keys 앞쪽에 있는 Control/Alt/Space/Shift/Z/X/C/V 는
     아케이드 조종기가 '키보드인 척'할 때 보내는 신호예요.
     뒤쪽 J/K/L 같은 키는 노트북으로 연습할 때 쓰라고 넣었어요.
     ---------------------------------------------------------------- */
  const BUTTONS = [
    { no: 1, act: 'jump',   label: '점프',    emoji: '🦘', arcade: 'A/X',   keys: ['ControlLeft', 'KeyJ'] },
    { no: 2, act: 'talk',   label: '말걸기',  emoji: '💬', arcade: 'B/○',   keys: ['AltLeft', 'KeyK'] },
    { no: 3, act: 'attack', label: '공격',    emoji: '✊', arcade: 'X/□',   keys: ['Space', 'KeyL'] },
    { no: 4, act: 'next',   label: '다음',    emoji: '➡️', arcade: 'Y/△',   keys: ['ShiftLeft', 'Enter'] },
    { no: 5, act: 'volume', label: '소리크기', emoji: '🔊', arcade: 'LB/L1', keys: ['KeyZ'] },
    { no: 6, act: 'pause',  label: '잠시멈춤', emoji: '⏸️', arcade: 'RB/R1', keys: ['KeyX'] },
    { no: 7, act: 'home',   label: '처음으로', emoji: '🏠', arcade: 'LT/L2', keys: ['KeyC'] },
    { no: 8, act: 'zoom',   label: '글씨크기', emoji: '🔍', arcade: 'RT/R2', keys: ['KeyV'] },
  ];

  /* 방향키 정보표예요. 방향 스틱도 이 방향들을 보내요. */
  const DIRS = {
    up:    ['ArrowUp', 'KeyW'],
    down:  ['ArrowDown', 'KeyS'],
    left:  ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
  };


  /* ----------------------------------------------------------------
     2. 지금 무엇이 눌려 있는지 기억하는 곳
     ---------------------------------------------------------------- */
  const dir  = { up: false, down: false, left: false, right: false };
  const held = {};   // 버튼이 지금 눌려 있는지 (act 이름 -> true/false)

  BUTTONS.forEach(function (b) { held[b.act] = false; });

  /* 누군가 "이 버튼 눌리면 알려줘!" 하고 부탁한 것들을 모아두는 곳 */
  const listeners = {};

  /* 이건 장이 바뀌어도 지워지지 않는 특별한 부탁이에요.
     5~8번 버튼(확대/멈추기/도움말/처음으로)처럼
     게임 어디서나 항상 되어야 하는 것들이 여기에 들어가요. */
  const systemListeners = {};

  /* 마지막으로 조종한 기기 이름 (화면에 보여줘요) */
  let deviceText = '키보드';

  /* true 이면 게임 조작이 잠깐 멈춰요 (덮개 화면이 열렸을 때) */
  let blocked = false;

  /* ================================================================
     ★ 조종기 맞추기 (직접 배우기)

     조종기는 종류마다 신호가 달라서, 미리 정해두면 안 맞을 수 있어요.
     그래서 선생님이 조종기를 실제로 움직이면
     그 신호를 그대로 기억해두고 쓰기로 했어요.

     기억한 내용은 브라우저에 저장돼서 다음에 켜도 그대로예요.
     ================================================================ */
  const MAP_KEY = 'dokrip.padmap';   // 저장할 때 쓰는 이름표
  let padMap = null;                 // { dirs:{up:규칙,...}, acts:{jump:규칙,...} }

  /* ★ 조종기 목록을 안전하게 가져와요.

     페이지가 '창 안의 창(iframe)' 안에서 열리면 브라우저가
     조종기 사용을 막아서 여기서 에러가 날 수 있어요.
     그러면 게임 전체가 멈춰버리니까, 에러를 잡아서 넘기고
     '막혔다'고 기억해둬요. */
  let padBlocked = false;

  function getPads() {
    try {
      if (!navigator.getGamepads) return [];
      return navigator.getGamepads() || [];
    } catch (e) {
      padBlocked = true;      // 브라우저가 조종기를 막았어요
      return [];
    }
  }

  /* 이 페이지가 창 안의 창(iframe) 안에 들어 있나요? */
  function inFrame() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }

  /* 저장해둔 설정을 불러와요 */
  function loadMap() {
    try {
      const raw = localStorage.getItem(MAP_KEY);
      if (raw) padMap = JSON.parse(raw);
    } catch (e) { padMap = null; }
  }
  loadMap();

  /* 축(스틱·십자키) 신호가 배운 것과 같은지 확인해요 */
  function axisMatches(rule, axes) {
    const v = axes[rule.index];
    if (v === undefined) return false;
    if (Math.abs(v) > 1.05) return false;        // 가운데(안 누름)

    if (Math.abs(rule.value) >= 0.85) {
      // 끝까지 기울인 신호 → 방향만 같으면 인정해요
      return rule.value > 0 ? v > 0.5 : v < -0.5;
    }
    // 십자키처럼 값이 딱 정해진 신호 → 그 값과 비슷해야 해요
    return Math.abs(v - rule.value) < 0.18;
  }

  /* 배운 규칙 하나가 지금 눌려 있는지 확인해요 */
  function ruleOn(rule, pad) {
    if (!rule) return false;
    if (rule.type === 'button') {
      const b = pad.buttons[rule.index];
      return b ? b.pressed : false;
    }
    return axisMatches(rule, pad.axes);
  }


  /* ----------------------------------------------------------------
     3. 도우미 함수들
     ---------------------------------------------------------------- */

  /* 어떤 키를 눌렀을 때, 그게 몇 번 버튼인지 찾아줘요 */
  function findButtonByKey(code) {
    return BUTTONS.find(function (b) { return b.keys.indexOf(code) !== -1; });
  }

  /* 어떤 키를 눌렀을 때, 그게 어느 방향인지 찾아줘요 */
  function findDirByKey(code) {
    for (const name in DIRS) {
      if (DIRS[name].indexOf(code) !== -1) return name;
    }
    return null;
  }

  /* "이 동작이 일어났어요!" 하고 부탁받은 사람들에게 알려줘요 */
  function fire(act) {
    // 먼저 항상 되어야 하는 것들(5~8번 버튼)에게 알려요
    if (systemListeners[act]) {
      systemListeners[act].forEach(function (fn) { fn(); });
    }
    // 덮개 화면(멈추기·도움말)이 열려 있으면 게임 조작은 잠깐 쉬어요
    if (blocked) return;

    // 그다음 지금 장에서 부탁한 것들에게 알려요
    const list = listeners[act];
    if (!list) return;
    list.forEach(function (fn) { fn(); });
  }

  /* 버튼이 눌리는 순간에 하는 일 */
  function pressButton(act) {
    if (held[act]) return;      // 이미 누르고 있으면 또 세지 않아요
    held[act] = true;
    highlight(act, true);       // 안내판에 불을 켜요

    // 뽁! 하고 버튼 소리가 나요
    // (5번은 소리 크기를 바꾸면서 스스로 소리를 내니까 빼요)
    if (act !== 'volume' && window.Sound) Sound.pok();

    fire(act);                  // 게임에 알려요
  }

  /* 버튼에서 손을 뗄 때 하는 일 */
  function releaseButton(act) {
    held[act] = false;
    highlight(act, false);      // 안내판 불을 꺼요
  }

  /* 방향이 눌리는 순간 */
  function pressDir(name) {
    if (dir[name]) return;
    dir[name] = true;
    highlightDir(name, true);
    fire('dir:' + name);        // 방향도 알려줘요 (퀴즈 고를 때 써요)
  }

  function releaseDir(name) {
    dir[name] = false;
    highlightDir(name, false);
  }


  /* ----------------------------------------------------------------
     4. 조작 안내판 그리기
        어떤 버튼이 무슨 일을 하는지 화면에서 볼 수 있어요.
     ---------------------------------------------------------------- */
  function drawGuide() {
    const box = document.getElementById('pad-buttons');
    if (!box) return;

    box.innerHTML = BUTTONS.map(function (b) {
      // 직접 맞춘 설정이 있으면 그걸 보여주고, 없으면 기본 이름을 보여줘요
      const learned = padMap && padMap.acts[b.act] ? padMap.acts[b.act].label : null;
      return (
        '<div class="pad-btn' + (learned ? ' is-learned' : '') + '" data-act="' + b.act + '">' +
          '<span class="pad-no">' + b.no + '</span>' +
          '<span class="pad-name">' + b.label + '</span>' +
          '<span class="pad-arcade">' + (learned || b.arcade) + '</span>' +
        '</div>'
      );
    }).join('');

    /* 마우스로도 조작할 수 있게, 안내판 버튼을 눌러도 동작해요! */
    box.querySelectorAll('.pad-btn').forEach(function (node) {
      const act = node.dataset.act;
      node.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        deviceText = '마우스';
        updateDeviceText();
        pressButton(act);
      });
      node.addEventListener('pointerup',    function () { releaseButton(act); });
      node.addEventListener('pointerleave', function () { releaseButton(act); });
    });

    /* 안내판의 방향 화살표도 마우스로 누를 수 있어요 */
    document.querySelectorAll('#pad-stick .pad-arrows b').forEach(function (node) {
      const name = node.dataset.dir;
      node.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        deviceText = '마우스';
        updateDeviceText();
        pressDir(name);
      });
      node.addEventListener('pointerup',    function () { releaseDir(name); });
      node.addEventListener('pointerleave', function () { releaseDir(name); });
    });
  }

  /* 버튼 칸에 불을 켜거나 꺼요 */
  function highlight(act, on) {
    const node = document.querySelector('.pad-btn[data-act="' + act + '"]');
    if (node) node.classList.toggle('is-down', on);
  }

  /* 방향 화살표에 불을 켜거나 꺼요 */
  function highlightDir(name, on) {
    const node = document.querySelector('#pad-stick b[data-dir="' + name + '"]');
    if (node) node.classList.toggle('is-down', on);
  }

  /* 지금 무엇으로 조작 중인지 화면에 써줘요 */
  function updateDeviceText() {
    const node = document.getElementById('pad-device');
    if (node) node.textContent = deviceText;
  }


  /* ----------------------------------------------------------------
     5. 키보드 신호 듣기
        (아케이드 조종기가 키보드로 인식될 때도 여기로 들어와요)
     ---------------------------------------------------------------- */
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;        // 꾹 누르고 있을 때 계속 들어오는 건 무시해요

    const d = findDirByKey(e.code);
    const b = findButtonByKey(e.code);

    if (d || b) {
      e.preventDefault();        // 화면이 위아래로 움직이지 않게 막아요
      deviceText = '키보드 / 조종기';
      updateDeviceText();
    }
    if (d) pressDir(d);
    if (b) pressButton(b.act);
  });

  window.addEventListener('keyup', function (e) {
    const d = findDirByKey(e.code);
    const b = findButtonByKey(e.code);
    if (d) releaseDir(d);
    if (b) releaseButton(b.act);
  });


  /* ----------------------------------------------------------------
     6. 게임패드(조종기) 신호 듣기
        조종기가 '게임패드'로 인식될 때 쓰는 방법이에요.
        게임패드는 신호를 보내주지 않아서, 우리가 계속 물어봐야 해요.
        그래서 1초에 60번씩 "지금 뭐 눌렸어?" 하고 확인해요.
     ---------------------------------------------------------------- */
  const padWas = {};             // 방금 전에 눌려 있었는지 기억해요
  const STICK_LIMIT = 0.5;       // 스틱을 이만큼 기울여야 '눌렀다'고 쳐요

  /* 조종기를 처음 연결했을 때 각 축이 어떤 값이었는지 적어둬요.
     아무것도 안 건드렸을 때의 값이니까, 이 값에서 벗어나면
     '움직였다'고 알 수 있어요. (조종기마다 기본값이 달라서 필요해요) */
  let padRest = null;

  /* 십자키(해트) 값을 방향으로 바꾸는 표예요.
     DINPUT 모드에서는 십자키가 버튼이 아니라
     이런 숫자 하나로 들어와요.
     -1 부터 1 까지 여덟 칸으로 나뉘어 있어요. */
  const HAT_DIRS = [
    ['up'], ['up', 'right'], ['right'], ['down', 'right'],
    ['down'], ['down', 'left'], ['left'], ['up', 'left'],
  ];

  /* 해트 값 하나를 방향 목록으로 바꿔줘요.

     ★ 조종기마다 '아무것도 안 누른 상태'의 값이 달라요.
       -1 ~ 1 을 벗어난 값(예: 3.29)으로 알려주는 조종기도 있고,
       0 으로 알려주는 조종기도 있어요. 둘 다 처리해요. */
  function readHat(value, rest) {
    if (value === undefined) return [];

    // (1) -1 ~ 1 을 벗어나면 확실히 가운데(안 누름)예요
    if (value > 1.05 || value < -1.05) return [];

    // (2) 0 에 아주 가까우면 가운데예요
    //     (해트 값은 0.14 부터 시작하니까 0.08 이면 안 겹쳐요)
    if (Math.abs(value) < 0.08) return [];

    // (3) 가운데 값이 -1~1 안에 있는 조종기라면,
    //     그 값과 아주 비슷할 때만 안 누른 것으로 봐요.
    //     (해트 값은 0.28 씩 떨어져 있어서 0.08 이면 넉넉해요)
    if (rest !== undefined && Math.abs(rest) <= 1.05 &&
        Math.abs(value - rest) < 0.08) return [];

    const index = Math.round((value + 1) * 3.5);   // 0 부터 7 까지
    return HAT_DIRS[index] || [];
  }

  window.addEventListener('gamepadconnected', function (e) {
    // mapping 이 'standard' 면 엑스인풋(XINPUT)으로 잘 연결된 거예요
    const kind = (e.gamepad.mapping === 'standard') ? 'XINPUT' : 'DINPUT';
    deviceText = '🕹️ 조종기 연결됨 (' + kind + ')';
    updateDeviceText();
  });

  window.addEventListener('gamepaddisconnected', function () {
    deviceText = '키보드';
    padRest = null;              // 다음에 꽂을 때 다시 재요
    updateDeviceText();
  });

  function checkGamepad() {
    const pads = getPads();

    for (let i = 0; i < pads.length; i++) {
      const pad = pads[i];
      if (!pad) continue;

      /* --- 버튼 8개 확인하기 ---
         배운 설정이 있으면 그 버튼을, 없으면 순서대로 1~8번을 봐요. */
      BUTTONS.forEach(function (b, index) {
        const byOrder = pad.buttons[index] ? pad.buttons[index].pressed : false;
        const byMap = padMap ? ruleOn(padMap.acts[b.act], pad) : false;
        const now = byMap || byOrder;
        const key = 'b' + index;

        if (now && !padWas[key]) pressButton(b.act);     // 방금 눌렸어요
        if (!now && padWas[key]) releaseButton(b.act);   // 방금 뗐어요
        padWas[key] = now;
      });

      /* --- 방향 스틱 확인하기 ---
         스틱은 숫자로 알려줘요.
         가로(axes[0])가 -1이면 왼쪽, +1이면 오른쪽
         세로(axes[1])가 -1이면 위,   +1이면 아래 */
      /* 조종기를 처음 봤으면, 안 건드렸을 때의 값을 적어둬요 */
      if (!padRest) padRest = Array.prototype.slice.call(pad.axes);

      /* ★ 직접 맞춘 설정이 있으면 먼저 확인해요.
         단, 기본 방식도 함께 살펴봐요. 그래야 조종기 옆 스위치를
         (LS ↔ DP ↔ RS) 바꿔도 다시 맞추지 않고 그냥 쓸 수 있어요. */
      const learned = { up: false, down: false, left: false, right: false };

      if (padMap) {
        ['up', 'down', 'left', 'right'].forEach(function (name) {
          learned[name] = ruleOn(padMap.dirs[name], pad);
        });
      }

      /* ★ 아케이드 스틱은 옆 스위치에 따라 신호가 세 가지로 달라져요.
           LS 로 두면  → axes 0, 1
           RS 로 두면  → axes 2, 3
           DP 로 두면  → 십자 버튼(12~15) 또는 해트 축
         어느 쪽으로 두어도 되게 전부 확인해요! */

      const x = biggest(pad.axes[0], pad.axes[2]);
      const y = biggest(pad.axes[1], pad.axes[3]);

      /* 십자 버튼 (XINPUT 모드에서 DP 로 두었을 때) */
      const dpad = {
        up:    isDown(pad.buttons[12]),
        down:  isDown(pad.buttons[13]),
        left:  isDown(pad.buttons[14]),
        right: isDown(pad.buttons[15]),
      };

      /* 해트 축 (DINPUT 모드에서 DP 로 두었을 때)
         네 번째 축부터 뒤쪽을 모두 살펴봐요. */
      const hat = { up: false, down: false, left: false, right: false };
      for (let a = 4; a < pad.axes.length; a++) {
        const v = pad.axes[a];

        /* 값이 -1~1 을 벗어나면 확실히 손을 뗀 상태예요.
           그때를 '가운데'로 다시 기억해두면,
           게임을 켤 때 스틱이 밀려 있었어도 저절로 고쳐져요! */
        if (v !== undefined && Math.abs(v) > 1.05) padRest[a] = v;

        readHat(v, padRest[a]).forEach(function (name) {
          hat[name] = true;
        });
      }

      /* 배운 설정이든 기본 방식이든, 하나라도 눌렸으면 움직여요 */
      setPadDir('up',    learned.up    || y < -STICK_LIMIT || dpad.up    || hat.up);
      setPadDir('down',  learned.down  || y >  STICK_LIMIT || dpad.down  || hat.down);
      setPadDir('left',  learned.left  || x < -STICK_LIMIT || dpad.left  || hat.left);
      setPadDir('right', learned.right || x >  STICK_LIMIT || dpad.right || hat.right);

      break;   // 조종기 1개만 쓰니까 첫 번째만 확인하고 끝내요
    }

    requestAnimationFrame(checkGamepad);   // 다시 확인하러 가요
  }

  /* 혹시 위에서 예상 못한 문제가 생겨도 게임이 멈추지 않도록
     한 겹 더 감싸줘요. */
  const rawCheck = checkGamepad;
  checkGamepad = function (t) {
    try { rawCheck(t); }
    catch (e) { requestAnimationFrame(checkGamepad); }
  };

  function isDown(btn) { return btn ? btn.pressed : false; }

  /* 두 숫자 중에 0에서 더 많이 벗어난 쪽을 골라줘요.
     (스틱을 LS 로 두든 RS 로 두든 움직인 쪽 값을 쓰려고요) */
  function biggest(a, b) {
    a = a || 0;
    b = b || 0;
    return Math.abs(a) >= Math.abs(b) ? a : b;
  }

  function setPadDir(name, now) {
    const key = 'd:' + name;
    if (now && !padWas[key]) pressDir(name);
    if (!now && padWas[key]) releaseDir(name);
    padWas[key] = now;
  }

  requestAnimationFrame(checkGamepad);


  /* ----------------------------------------------------------------
     7. 다른 파일에서 쓸 수 있게 열어두는 기능들
     ---------------------------------------------------------------- */
  return {
    /* 지금 눌려 있는 방향을 볼 수 있어요. 예) Input.dir.left */
    dir: dir,

    /* 지금 눌려 있는 버튼을 볼 수 있어요. 예) Input.held.jump */
    held: held,

    /* 버튼 정보표 */
    buttons: BUTTONS,

    /* "이 동작이 일어나면 알려줘!" 하고 부탁하는 방법
       예) Input.on('jump', function(){ ... })
           Input.on('dir:left', function(){ ... })              */
    on: function (act, fn) {
      if (!listeners[act]) listeners[act] = [];
      listeners[act].push(fn);
    },

    /* 장이 바뀌어도 지워지지 않는 부탁이에요 (5~8번 버튼에 써요) */
    onSystem: function (act, fn) {
      if (!systemListeners[act]) systemListeners[act] = [];
      systemListeners[act].push(fn);
    },

    /* 게임 조작을 잠깐 멈추거나 다시 켜요.
       (5~8번 버튼은 멈춰도 계속 눌러서 쓸 수 있어요) */
    setBlocked: function (v) { blocked = v; },

    /* 부탁을 취소해요 (장이 바뀔 때 정리하려고 만들었어요)
       단, onSystem 으로 건 부탁은 지워지지 않아요! */
    clear: function () {
      for (const key in listeners) delete listeners[key];
    },

    /* 버튼의 이름표를 바꿔요 (장마다 하는 일이 달라질 수 있어요) */
    setLabel: function (act, label, emoji) {
      const b = BUTTONS.find(function (x) { return x.act === act; });
      if (!b) return;
      b.label = label;
      if (emoji) b.emoji = emoji;
      drawGuide();
    },

    /* ---------- 조종기 맞추기에 쓰는 기능들 ---------- */

    /* 지금 조종기 상태를 사진 찍듯 그대로 담아와요 */
    snapshot: function () {
      const pads = getPads();
      for (let i = 0; i < pads.length; i++) {
        if (!pads[i]) continue;
        return {
          axes: Array.prototype.slice.call(pads[i].axes),
          buttons: pads[i].buttons.map(function (b) { return b.pressed; }),
        };
      }
      return null;
    },

    /* 사진 찍어둔 때와 비교해서, 무엇이 새로 눌렸는지 찾아줘요.
       찾으면 그 신호를 설명하는 '규칙'을 돌려줘요. */
    findChange: function (before) {
      const now = this.snapshot();
      if (!now || !before) return null;

      // (1) 새로 눌린 버튼이 있나요?
      for (let i = 0; i < now.buttons.length; i++) {
        if (now.buttons[i] && !before.buttons[i]) {
          return { type: 'button', index: i, label: '버튼 ' + (i + 1) };
        }
      }

      // (2) 크게 움직인 축(스틱·십자키)이 있나요?
      let best = null;
      let bestMove = 0.45;                 // 이만큼은 움직여야 인정해요
      for (let i = 0; i < now.axes.length; i++) {
        const moved = Math.abs(now.axes[i] - (before.axes[i] || 0));
        if (moved > bestMove && Math.abs(now.axes[i]) <= 1.05) {
          bestMove = moved;
          best = {
            type: 'axis',
            index: i,
            value: Math.round(now.axes[i] * 100) / 100,
            label: '축 ' + i + ' (' + (Math.round(now.axes[i] * 100) / 100) + ')',
          };
        }
      }
      return best;
    },

    /* 다 맞춘 설정을 저장해요 */
    saveMap: function (map) {
      padMap = map;
      try { localStorage.setItem(MAP_KEY, JSON.stringify(map)); } catch (e) {}
      drawGuide();
    },

    /* 맞춘 설정을 지우고 기본값으로 되돌려요 */
    clearMap: function () {
      padMap = null;
      try { localStorage.removeItem(MAP_KEY); } catch (e) {}
      drawGuide();
    },

    /* 지금 맞춘 설정이 있나요? */
    hasMap: function () { return !!padMap; },

    /* 브라우저가 조종기를 막았나요? (창 안의 창일 때 그래요) */
    isBlocked: function () { return padBlocked; },

    /* 이 페이지가 창 안의 창 안에 들어 있나요? */
    inFrame: inFrame,

    /* 어떤 동작이 조종기의 무엇에 연결됐는지 글자로 알려줘요 */
    sourceLabel: function (act) {
      if (!padMap || !padMap.acts[act]) return null;
      return padMap.acts[act].label;
    },

    /* 지금 연결된 조종기의 속살을 그대로 보여줘요.
       (조종기 확인 화면에서 써요) */
    readPads: function () {
      const pads = getPads();
      const list = [];
      for (let i = 0; i < pads.length; i++) {
        if (!pads[i]) continue;
        list.push({
          id: pads[i].id,
          mapping: pads[i].mapping,
          axes: Array.prototype.slice.call(pads[i].axes),
          buttons: pads[i].buttons.map(function (b) { return b.pressed; }),
        });
      }
      return list;
    },

    /* 처음 한 번 안내판을 그려요 */
    init: function () {
      drawGuide();
      updateDeviceText();
    },
  };
})();

/* 화면이 다 준비되면 안내판을 그려요 */
Input.init();


/* ===== js/missions.js ===== */
/* ==================================================================
   독립을 향하여 - 미션 보관함 (missions.js)

   각 장의 미션 게임을 여기에 하나씩 담아둘 거예요.
   예) MISSIONS[1] = 1장 미션,  MISSIONS[2] = 2장 미션 ...

   미션 하나는 이렇게 생겼어요.
   {
     start: function (성공했을때, 들켰을때) { ... 미션 시작 ... },
     stop:  function () { ... 미션 정리 ... },
     hint:  '화면 아래 말풍선에 보여줄 조작 설명',
   }
   ================================================================== */

const MISSIONS = {};


/* ------------------------------------------------------------------
   모든 미션이 함께 쓰는 편리한 도구들이에요.
   ------------------------------------------------------------------ */
const MissionUtil = {

  /* 게임 무대를 비우고 새 화면을 그려요 */
  setStage: function (html) {
    const stage = document.getElementById('stage-inner');
    stage.innerHTML = html;
    return stage;
  },

  /* 0과 1 사이의 아무 숫자나 뽑아요 (min 과 max 사이의 값) */
  random: function (min, max) {
    return min + Math.random() * (max - min);
  },

  /* 숫자가 너무 작거나 커지지 않게 울타리를 쳐요 */
  clamp: function (value, min, max) {
    return Math.max(min, Math.min(max, value));
  },

  /* 실루엣 캐릭터 한 명을 그려요.
     who : 'hero'(주인공) 'police'(경찰) 'kimgu'(김구)
           'yu'(유관순) 'mate'(동료) 'captain'(헌병대장)
     extra : 덧붙일 이름표 (예: 'm1-hero') */
  figure: function (who, extra) {
    return '<span class="fig fig--' + who + ' ' + (extra || '') + '">' +
             '<i class="f-hat"></i>' +
             '<i class="f-head"><i class="f-eyes"></i></i>' +
             '<i class="f-body"></i>' +
           '</span>';
  },
};


/* ===== js/ch1.js ===== */
/* ==================================================================
   1장 · 비밀 편지  (ch1.js)

   ★ 놀이 방법은 '무궁화 꽃이 피었습니다' 와 똑같아요!

   - 일본 경찰이 뒤를 돌아보고 있을 때(🙈) 앞으로 달려요
   - 경찰이 이쪽을 볼 때(👀) 움직이면 들켜요!
   - 오른쪽 끝 비밀 아지트까지 편지를 전달하면 성공이에요

   조작 : 오른쪽 방향키(또는 스틱 오른쪽)를 꾹 누르면 앞으로 가요
          마우스로 화면을 꾹 눌러도 앞으로 가요
   ================================================================== */

MISSIONS[1] = (function () {

  /* ----------------------------------------------------------------
     1. 이 미션이 기억해야 할 것들
     ---------------------------------------------------------------- */
  let hero = 0;            // 주인공이 어디까지 왔는지 (0 = 출발, 100 = 도착)
  let cops = [];           // 경찰들의 상태 (처음엔 한 명, 나중에 두 명)
  let secondCame = false;  // 두 번째 경찰이 나왔는지
  let running = false;     // 미션이 진행 중인지
  let mouseHold = false;   // 마우스를 누르고 있는지
  let lastTime = 0;        // 시간을 재려고 기억해두는 값

  let onSuccess = null;    // 성공하면 부를 함수
  let onFail = null;       // 들키면 부를 함수

  let node = {};           // 화면 조각들을 담아둘 곳

  /* 주인공이 달리는 빠르기 (1초에 몇 칸 가는지)
     숫자를 줄이면 길이 길어져서 게임이 오래 걸려요. */
  const SPEED = 17;

  /* 두 번째 경찰이 나타나는 지점이에요.
     거의 다 왔을 때만 나와서, 앞부분은 편하게 갈 수 있어요. */
  const SECOND_AT = 70;

  /* ★ 봐주는 시간 (초)
     경찰이 막 돌아본 순간에는 이만큼 안 잡아줘요.
     "앗!" 하고 손을 떼면 살 수 있어요. 어린 동생들에게 꼭 필요해요! */
  const GRACE = 0.4;


  /* ----------------------------------------------------------------
     2. 경찰의 세 가지 상태

     'away'    🙈 뒤돌아 있음  → 지금이 달릴 기회!
     'warning' 🤔 돌아보려고 함 → 얼른 멈춰야 해요
     'watching'👀 이쪽을 봄     → 움직이면 들켜요!
     ---------------------------------------------------------------- */
  function nextState(cop) {
    // 도착에 가까워질수록 어려워져요 (기획서: 점점 어려워진다)
    const hard = hero / 100;          // 0에서 시작해 1까지 커져요

    if (cop.state === 'away') {
      cop.state = 'warning';
      // '돌아본다!' 신호를 아주 넉넉히 보여줘서 멈출 시간을 충분히 줘요
      cop.timer = MissionUtil.clamp(2.0 - hard * 0.3, 1.5, 2.1);

    } else if (cop.state === 'warning') {
      cop.state = 'watching';
      cop.watched = 0;                       // 이제 막 돌아봤어요 (봐주는 시간 시작)
      cop.timer = MissionUtil.random(0.9, 1.5) + hard * 0.25;
      if (window.Sound) Sound.alert();       // 삐빅! 조심하라는 소리

    } else {
      cop.state = 'away';
      // 달릴 수 있는 시간을 넉넉하게 줘요
      cop.timer = MissionUtil.clamp(MissionUtil.random(3.2, 4.5) - hard * 0.7, 2.0, 4.5);
    }

    cop.timerMax = cop.timer;    // 남은 시간 막대를 그리려고 기억해둬요
    drawPolice();
  }

  /* 지금 경찰이 이쪽을 보고 있나요? (신호등 색을 정할 때 써요) */
  function isWatched() {
    return cops.some(function (cop) { return cop.state === 'watching'; });
  }

  /* 지금 움직이면 진짜로 들키나요?
     ★ 막 돌아본 순간(GRACE 동안)에는 봐줘요.
       "멈춰!" 가 뜬 뒤 얼른 손을 떼면 살 수 있어요. */
  function isCaught() {
    return cops.some(function (cop) {
      return cop.state === 'watching' && cop.watched > GRACE;
    });
  }

  /* 곧 돌아보려는 경찰이 있나요? */
  function isWarning() {
    return cops.some(function (cop) { return cop.state === 'warning'; });
  }


  /* ----------------------------------------------------------------
     3. 화면 그리기
     ---------------------------------------------------------------- */

  /* 경찰의 얼굴과 말풍선을 바꿔요 */
  function drawPolice() {
    const words = { away: '......', warning: '음?', watching: '누구냐!' };

    cops.forEach(function (cop) {
      if (!cop.node) return;
      cop.wordNode.textContent = words[cop.state];
      cop.figNode.classList.toggle('is-looking', cop.state === 'watching');
      cop.node.className = 'm1-police is-' + cop.state;
    });

    /* 가운데 신호등은 '가장 위험한 상태'를 보여줘요.
       한 명이라도 보고 있으면 빨간불이에요! */
    let light = 'away';
    if (isWatched())      light = 'watching';
    else if (isWarning()) light = 'warning';

    node.light.className = 'm1-light is-' + light;
    node.light.textContent =
      { away: '지금 달려!', warning: '멈출 준비!', watching: '멈춰!' }[light];
  }

  /* '돌아본다!' 신호가 얼마나 남았는지 막대로 보여줘요.
     막대가 다 줄어들면 경찰이 이쪽을 봐요! */
  function drawCountdown() {
    if (!node.count) return;

    // 곧 돌아보려는 경찰 중에 가장 급한 사람을 찾아요
    let left = 0;
    cops.forEach(function (cop) {
      if (cop.state !== 'warning') return;
      const ratio = cop.timer / (cop.timerMax || 1);
      if (left === 0 || ratio < left) left = ratio;
    });

    node.count.style.width = Math.max(0, Math.min(1, left)) * 100 + '%';
    node.count.classList.toggle('is-on', left > 0);
  }

  /* 주인공을 지금 위치로 옮겨요 */
  function drawHero(moving) {
