    node.hero.style.left = hero + '%';
    node.hero.classList.toggle('is-running', moving);
    node.barFill.style.width = hero + '%';
  }


  /* ----------------------------------------------------------------
     4. 1초에 60번 반복되는 게임의 심장
     ---------------------------------------------------------------- */
  function loop(now) {
    if (!running) return;

    // 지난 번과 지금 사이에 몇 초가 흘렀는지 재요
    const delta = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // 잠시 멈춤 중이면 아무것도 안 해요
    if (game.paused) {
      requestAnimationFrame(loop);
      return;
    }

    // (1) 경찰들의 상태를 시간에 따라 바꿔요
    cops.forEach(function (cop) {
      cop.timer -= delta;
      // 이쪽을 보고 있는 동안 시간을 세요 (봐주는 시간 계산에 써요)
      if (cop.state === 'watching') cop.watched += delta;
      if (cop.timer <= 0) nextState(cop);
    });

    // (2) 절반쯤 오면 두 번째 경찰이 나타나요!
    if (!secondCame && hero >= SECOND_AT) {
      addSecondCop();
    }

    // (3) 지금 앞으로 가라는 신호가 들어왔는지 확인해요
    const wantMove = Input.dir.right || Input.dir.up || mouseHold;

    if (wantMove) {
      // 경찰이 보고 있는데 계속 움직이면 들켜요!
      // (막 돌아본 순간에는 봐줘서, 얼른 멈추면 살 수 있어요)
      if (isCaught()) {
        running = false;
        showCaughtEffect();
        return;
      }
      // 안전하면 앞으로 나아가요
      hero = MissionUtil.clamp(hero + SPEED * delta, 0, 100);
    }

    drawHero(wantMove);
    drawCountdown();

    // (4) 도착했으면 성공!
    if (hero >= 100) {
      running = false;
      showSuccessEffect();
      return;
    }

    requestAnimationFrame(loop);
  }


  /* ----------------------------------------------------------------
     5. 들켰을 때 / 성공했을 때
     ---------------------------------------------------------------- */
  function showCaughtEffect() {
    node.hero.classList.add('is-caught');   // 주인공이 붉게 물들어요
    cops.forEach(function (cop) {
      if (cop.state === 'watching') cop.node.classList.add('is-angry');
    });
    setTimeout(function () { onFail('움직이는 걸 경찰이 봤어요!'); }, 700);
  }

  function showSuccessEffect() {
    node.goal.classList.add('is-clear');    // 아지트 문이 밝게 빛나요
    setTimeout(function () { onSuccess(); }, 700);
  }


  /* ----------------------------------------------------------------
     6. 미션 시작하기
     ---------------------------------------------------------------- */
  function start(success, fail) {
    onSuccess = success;
    onFail = fail;

    // 처음 상태로 되돌려요
    hero = 0;
    cops = [];
    secondCame = false;
    mouseHold = false;
    running = true;

    // 화면을 그려요
    const stage = MissionUtil.setStage(
      '<div class="m1-scene">' +

        // 위쪽 : 일본 경찰들이 서는 자리
        // (처음엔 한 명, 절반쯤 가면 한 명이 더 나와요)
        '<div class="m1-cops"></div>' +

        // 가운데 : 신호등처럼 알려주는 글씨와 남은 시간 막대
        '<div class="m1-signal">' +
          '<div class="m1-light is-away">지금 달려!</div>' +
          '<div class="m1-count-bar"><div class="m1-count"></div></div>' +
        '</div>' +

        // 아래쪽 : 길과 주인공
        '<div class="m1-road">' +
          '<div class="m1-goal"></div>' +          // 비밀 아지트 (대문 모양)
          '<div class="m1-hero">' + MissionUtil.figure('hero') + '</div>' +
        '</div>' +

        // 두 번째 경찰이 나타날 때 뜨는 알림
        '<p class="m1-warn"></p>' +

        // 맨 아래 : 얼마나 왔는지 보여주는 막대
        '<div class="m1-bar"><div class="m1-bar-fill"></div></div>' +
        '<p class="m1-tip">오른쪽 방향키를 <b>꾹</b> 누르면 달려요 · ' +
        '「멈춰!」 가 뜨면 <b>얼른 손을 떼면</b> 살 수 있어요</p>' +

      '</div>'
    );

    // 화면 조각들을 찾아서 기억해둬요
    node = {
      copsBox: stage.querySelector('.m1-cops'),
      light:   stage.querySelector('.m1-light'),
      count:   stage.querySelector('.m1-count'),
      hero:    stage.querySelector('.m1-hero'),
      goal:    stage.querySelector('.m1-goal'),
      barFill: stage.querySelector('.m1-bar-fill'),
      warn:    stage.querySelector('.m1-warn'),
    };

    addCop('첫 번째 경찰', 3.4);   // 처음엔 넉넉히 달릴 수 있어요
    drawPolice();
    drawHero(false);

    // 마우스로 화면을 누르고 있어도 앞으로 가요
    stage.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      mouseHold = true;
    });
    window.addEventListener('pointerup', releaseMouse);

    // 심장을 뛰게 해요!
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function releaseMouse() { mouseHold = false; }


  /* ----------------------------------------------------------------
     경찰 한 명을 새로 만들어 화면에 세워요
     ---------------------------------------------------------------- */
  function addCop(name, firstTimer) {
    const box = document.createElement('div');
    box.className = 'm1-police is-away';
    box.innerHTML =
      '<span class="m1-word"></span>' +
      '<span class="m1-face">' + MissionUtil.figure('police') + '</span>' +
      '<span class="m1-copname">' + name + '</span>';

    node.copsBox.appendChild(box);

    cops.push({
      state: 'away',
      timer: firstTimer,
      watched: 0,          // 이쪽을 본 지 얼마나 됐는지 (봐주는 시간에 써요)
      node: box,
      wordNode: box.querySelector('.m1-word'),
      figNode: box.querySelector('.fig'),
    });
  }

  /* 절반쯤 왔을 때 두 번째 경찰이 나타나요.
     이제 두 경찰이 모두 뒤돌아야만 달릴 수 있어요! */
  function addSecondCop() {
    secondCame = true;
    addCop('두 번째 경찰', 2.2);

    node.warn.textContent = '경찰이 한 명 더 왔다! 둘 다 뒤돌아야 달릴 수 있다.';
    node.warn.classList.add('is-on');
    setTimeout(function () { node.warn.classList.remove('is-on'); }, 3000);

    if (window.Sound) Sound.alert();
    drawPolice();
  }


  /* ----------------------------------------------------------------
     7. 미션 정리하기 (다른 장으로 넘어갈 때 불러요)
     ---------------------------------------------------------------- */
  function stop() {
    running = false;
    mouseHold = false;
    window.removeEventListener('pointerup', releaseMouse);
  }


  /* 이 미션을 밖에서 쓸 수 있게 내보내요 */
  return {
    start: start,
    stop: stop,
    hint: '경찰이 뒤돌았을 때만 달려라. 「멈춰!」가 뜨면 얼른 손을 떼면 된다.',
  };
})();


/* ===== js/ch2.js ===== */
/* ==================================================================
   2장 · 김구 선생님과의 만남  (ch2.js)

   비밀 아지트에서 김구 선생님을 만나 역사 퀴즈 3개를 풀어요.

   - 한 문제 맞힐 때마다 독립 포인트 +5점 (3개 다 맞히면 15점)
   - 문제는 쉬움 → 보통 → 어려움 순서로 점점 어려워져요
   - 틀리면 선생님이 정답을 알려주고 그 문제를 다시 물어봐요

   조작 : 스틱(방향키) 위 아래로 답을 고르고
          2번 버튼(말걸기)으로 대답해요. 마우스로 눌러도 돼요.
   ================================================================== */

MISSIONS[2] = (function () {

  /* ----------------------------------------------------------------
     1. 문제 보관함
        난이도별로 3문제씩, 모두 9문제를 담아뒀어요.
        q     : 문제
        a     : 정답
        wrong : 틀린 보기 2개
        why   : 틀렸을 때 알려줄 설명
     ---------------------------------------------------------------- */
  const QUIZ_BANK = {

    easy: [
      { q: '우리나라 국기의 이름은 무엇일까요?',
        a: '태극기', wrong: ['일장기', '성조기'],
        why: '일장기는 일본, 성조기는 미국의 국기예요.' },

      { q: '광복절은 몇 월 며칠일까요?',
        a: '8월 15일', wrong: ['3월 1일', '6월 25일'],
        why: '1945년 8월 15일, 우리나라가 광복을 맞이했어요.' },

      { q: '3·1운동 때 사람들이 다 함께 외친 말은?',
        a: '대한 독립 만세', wrong: ['대한민국 만세', '광복 만세'],
        why: '1919년 3월 1일, 온 나라에 "대한 독립 만세" 소리가 울려 퍼졌어요.' },
    ],

    normal: [
      { q: '3·1운동에서 만세를 부르다 붙잡힌 소녀는 누구일까요?',
        a: '유관순', wrong: ['신사임당', '논개'],
        why: '유관순은 열일곱 살에 만세운동을 이끌었어요.' },

      { q: '대한민국 임시정부를 이끈 분은 누구일까요?',
        a: '김구', wrong: ['이순신', '세종대왕'],
        why: '김구 선생님은 임시정부의 주석으로 독립운동을 이끌었어요.' },

      { q: '태극기 가운데 있는 동그란 무늬의 이름은?',
        a: '태극', wrong: ['무궁화', '해와 달'],
        why: '빨강과 파랑이 어우러진 이 무늬를 태극이라고 해요.' },
    ],

    hard: [
      { q: '대한민국 임시정부가 세워진 나라는 어디일까요?',
        a: '중국', wrong: ['일본', '미국'],
        why: '1919년 중국 상하이에 대한민국 임시정부를 세웠어요.' },

      { q: '김구 선생님이 쓴 책의 이름은 무엇일까요?',
        a: '백범일지', wrong: ['난중일기', '목민심서'],
        why: '백범은 김구 선생님의 호예요. 난중일기는 이순신 장군이 썼어요.' },

      { q: '우리나라가 일본에게 나라를 빼앗긴 해는 언제일까요?',
        a: '1910년', wrong: ['1945년', '1950년'],
        why: '1910년부터 1945년까지, 35년 동안 나라를 빼앗겼어요.' },
    ],
  };

  /* ----------------------------------------------------------------
     2. 이번에 낼 문제 3개를 고르는 곳
        [난이도, 몇 번째 문제] 로 적어요. (0이 1번, 1이 2번, 2가 3번)

        ★ 문제를 바꾸고 싶으면 아래 숫자만 고치면 돼요! ★
        지금은 쉬움 3번 → 보통 3번 → 어려움 3번 이에요.
     ---------------------------------------------------------------- */
  const PICK = [
    ['easy',   2],   // 쉬움 3번 : 3·1운동 때 외친 말
    ['normal', 2],   // 보통 3번 : 태극기 가운데 무늬
    ['hard',   2],   // 어려움 3번 : 나라를 빼앗긴 해
  ];

  const POINT_PER_QUIZ = 5;   // 한 문제 맞힐 때마다 주는 점수


  /* ----------------------------------------------------------------
     3. 이 미션이 기억해야 할 것들
     ---------------------------------------------------------------- */
  let quizIndex = 0;       // 지금 몇 번째 문제인지
  let choices = [];        // 지금 문제의 보기 3개 (섞은 것)
  let cursor = 0;          // 지금 고르고 있는 보기 번호
  let locked = false;      // 답을 맞춘 뒤 잠깐 못 누르게 잠그는 값
  let onSuccess = null;
  let node = {};


  /* ----------------------------------------------------------------
     4. 도우미
     ---------------------------------------------------------------- */

  /* PICK 에 적힌 대로 문제를 꺼내와요 */
  function getQuiz(i) {
    const level = PICK[i][0];
    const number = PICK[i][1];
    return QUIZ_BANK[level][number];
  }

  /* 보기 순서를 섞어요. 그래야 정답이 항상 같은 자리에 있지 않아요! */
  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = copy[i];
      copy[i] = copy[j];
      copy[j] = temp;
    }
    return copy;
  }


  /* ----------------------------------------------------------------
     5. 화면 그리기
     ---------------------------------------------------------------- */

  /* 새 문제를 화면에 펼쳐요 */
  function showQuiz() {
    const quiz = getQuiz(quizIndex);

    // 정답과 틀린 보기를 합쳐서 섞어요
    choices = shuffle([quiz.a].concat(quiz.wrong));
    cursor = 0;
    locked = false;

    node.count.textContent = (quizIndex + 1) + ' / ' + PICK.length;
    node.question.textContent = quiz.q;
    node.talk.textContent = '';
    node.talk.className = 'm2-talk';

    drawChoices();
  }

  /* 보기 3개를 그려요 */
  function drawChoices() {
    node.choices.innerHTML = choices.map(function (text, i) {
      return '<button class="m2-choice' + (i === cursor ? ' is-on' : '') + '" ' +
             'data-index="' + i + '">' +
               '<span class="m2-num">' + (i + 1) + '</span>' +
               '<span>' + text + '</span>' +
             '</button>';
    }).join('');

    // 마우스로 보기를 눌러도 답이 돼요
    node.choices.querySelectorAll('.m2-choice').forEach(function (btn) {
      btn.addEventListener('click', function () {
        cursor = Number(btn.dataset.index);
        answer();
      });
    });
  }

  /* 고르는 자리를 위아래로 옮겨요 */
  function moveCursor(step) {
    if (locked) return;
    cursor = (cursor + step + choices.length) % choices.length;
    drawChoices();
  }


  /* ----------------------------------------------------------------
     6. 답을 말했을 때
     ---------------------------------------------------------------- */
  function answer() {
    if (locked) return;
    locked = true;

    const quiz = getQuiz(quizIndex);
    const picked = choices[cursor];

    if (picked === quiz.a) {
      /* ---- 맞았어요! ---- */
      node.talk.textContent = '옳거니! 잘 알고 있구나.';
      node.talk.className = 'm2-talk is-right';
      markChoice(true);

      addScore(POINT_PER_QUIZ);        // 한 문제당 5점

      // 잠시 뒤 다음 문제로 넘어가요
      setTimeout(function () {
        quizIndex += 1;
        if (quizIndex >= PICK.length) {
          onSuccess();                 // 3문제를 다 맞혔어요!
        } else {
          showQuiz();
        }
      }, 1200);

    } else {
      /* ---- 틀렸어요 ---- */
      if (window.Sound) Sound.ppyong();

      node.talk.textContent = '아니란다. 정답은 「' + quiz.a + '」 이야. ' + quiz.why;
      node.talk.className = 'm2-talk is-wrong';
      markChoice(false);

      // 잠시 뒤 같은 문제를 다시 물어봐요 (보기 순서는 새로 섞여요)
      setTimeout(showQuiz, 2600);
    }
  }

  /* 고른 보기에 맞음/틀림 표시를 해요 */
  function markChoice(isRight) {
    const quiz = getQuiz(quizIndex);

    node.choices.querySelectorAll('.m2-choice').forEach(function (btn, i) {
      if (i === cursor) btn.classList.add(isRight ? 'is-right' : 'is-wrong');
      // 틀렸을 때는 진짜 정답도 함께 알려줘요
      if (!isRight && choices[i] === quiz.a) btn.classList.add('is-answer');
    });
  }


  /* ----------------------------------------------------------------
     7. 미션 시작하기
     ---------------------------------------------------------------- */
  function start(success) {
    onSuccess = success;
    quizIndex = 0;

    const stage = MissionUtil.setStage(
      '<div class="m2-scene">' +

        // 왼쪽 : 김구 선생님
        '<div class="m2-person">' +
          MissionUtil.figure('kimgu', 'is-looking') +
          '<span class="m2-name">김구</span>' +
        '</div>' +

        // 오른쪽 : 문제와 보기
        '<div class="m2-panel">' +
          '<div class="m2-head">' +
            '<span class="m2-label">역사 문제</span>' +
            '<span class="m2-count"></span>' +
          '</div>' +
          '<p class="m2-question"></p>' +
          '<div class="m2-choices"></div>' +
          '<p class="m2-talk"></p>' +
          '<p class="m2-tip">스틱 위·아래로 고르고, 2번 버튼으로 대답한다</p>' +
        '</div>' +

      '</div>'
    );

    node = {
      count:    stage.querySelector('.m2-count'),
      question: stage.querySelector('.m2-question'),
      choices:  stage.querySelector('.m2-choices'),
      talk:     stage.querySelector('.m2-talk'),
    };

    showQuiz();

    // 조종기와 키보드를 연결해요
    Input.on('dir:up',   function () { moveCursor(-1); });
    Input.on('dir:down', function () { moveCursor(1); });
    Input.on('talk',     answer);      // 2번 버튼 : 말걸기
    Input.on('next',     answer);      // 4번 버튼으로도 대답할 수 있어요
  }

  function stop() {
    locked = true;
  }


  return {
    start: start,
    stop: stop,
    hint: '김구 선생님의 물음에 답하여라. 스틱 위·아래로 고르고 2번 버튼으로 대답한다.',
  };
})();


/* ===== js/ch3.js ===== */
/* ==================================================================
   3장 · 태극기 지키기  (ch3.js)

   미로를 돌아다니며 숨겨진 태극기를 찾고,
   안전한 곳으로 무사히 옮기면 성공이에요.

   ★ 일본 경찰이 두 종류 나와요!

     1) 순찰 경찰 🚶 : 정해진 길을 왔다 갔다 해요.
                       움직임을 잘 보고 타이밍을 맞춰 지나가세요.

     2) 보초 경찰 🧍 : 길목에 가만히 서서 지켜요.
                       빨갛게 표시된 경계 구역에 들어가면 들켜요.
                       다른 길로 돌아가야 해요!

   조작 : 스틱(방향키)으로 네 방향 움직이기
   ================================================================== */

MISSIONS[3] = (function () {

  /* ----------------------------------------------------------------
     1. 미로 지도
        '#' 은 벽, '.' 은 지나갈 수 있는 길이에요.
     ---------------------------------------------------------------- */
  const MAZE = [
    '#####################',
    '#.......#.....#.....#',
    '#.#.#.#.###.#.#.#.#.#',
    '#.....#.....#.......#',
    '#.#.###.#.#.#####.#.#',
    '#.#.#...............#',
    '#.#.#.###.#####.#.#.#',
    '#...#.#.............#',
    '#.#.#.#.###.###.#.#.#',
    '#.........#.........#',
    '#.###.###.###.#.###.#',
    '#.......#...........#',
    '#####################',
  ];

  const ROWS = MAZE.length;      // 세로 칸 수 (13)
  const COLS = MAZE[0].length;   // 가로 칸 수 (21)

  const START = { r: 1, c: 1 };    // 주인공이 출발하는 곳
  const SAFE  = { r: 11, c: 1 };   // 태극기를 모두 가져가야 할 안전한 곳

  /* ★ 태극기 5장이 미로 곳곳에 따로 숨겨져 있어요!
     다섯 장을 모두 찾아야 안전한 곳으로 갈 수 있어요. */
  const FLAGS = [
    { r: 1,  c: 9  },
    { r: 1,  c: 19 },
    { r: 7,  c: 13 },
    { r: 11, c: 5  },
    { r: 11, c: 19 },
  ];

  /* 보초 경찰이 서 있는 자리예요.
     이 자리와 바로 옆 칸이 '경계 구역'이 돼요.
     세 명 모두 피해도 태극기를 다 모을 수 있는지 미리 확인했어요. */
  const GUARDS = [
    { r: 3,  c: 19 },
    { r: 5,  c: 12 },
    { r: 10, c: 15 },
  ];

  /* 순찰 경찰이 왔다 갔다 하는 길이에요.

     ★ 중요 : 순찰 경찰이 걷는 복도를 통째로 피해도
       태극기 다섯 장과 안전한 곳에 모두 갈 수 있는지 확인했어요.
       그래서 부딪힐 것 같으면 언제든 다른 길로 돌아가면 돼요! */
  const PATROLS = [
    [ { r: 1, c: 2 },  { r: 1, c: 7 }  ],   // 출발 근처 위쪽 복도
    [ { r: 2, c: 7 },  { r: 5, c: 7 }  ],   // 왼쪽 가운데 세로 복도
    [ { r: 2, c: 19 }, { r: 7, c: 19 } ],   // 오른쪽 끝 세로 복도
  ];

  /* 게임 빠르기 (숫자가 작을수록 빨라요, 단위는 밀리초) */
  const HERO_STEP   = 135;   // 주인공이 한 칸 움직이는 데 걸리는 시간
  const PATROL_STEP = 420;   // 순찰 경찰이 한 칸 움직이는 시간


  /* ----------------------------------------------------------------
     2. 이 미션이 기억해야 할 것들
     ---------------------------------------------------------------- */
  let hero = { r: 0, c: 0 };
  let taken = [];             // 주운 태극기 번호들
  let patrols = [];           // 순찰 경찰들의 상태
  let dangerCells = [];       // 보초 경찰의 경계 구역
  let running = false;
  let heroTimer = 0;          // 주인공이 다음에 움직일 수 있는 시각
  let lastTime = 0;
  let onSuccess = null;
  let onFail = null;
  let node = {};


  /* ----------------------------------------------------------------
     3. 미로를 다루는 도우미들
     ---------------------------------------------------------------- */

  /* 그 칸이 지나갈 수 있는 길인가요? */
  function isOpen(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    return MAZE[r][c] === '.';
  }

  /* 두 칸이 같은 자리인가요? */
  function same(a, b) { return a.r === b.r && a.c === b.c; }

  /* 보초 경찰의 경계 구역을 만들어요.
     보초가 선 칸 + 바로 옆 네 칸이 위험해요. */
  function makeDangerCells() {
    const list = [];
    GUARDS.forEach(function (g) {
      list.push({ r: g.r, c: g.c });
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
        const r = g.r + d[0];
        const c = g.c + d[1];
        if (isOpen(r, c)) list.push({ r: r, c: c });
      });
    });
    return list;
  }

  /* 그 칸이 보초의 경계 구역인가요? */
  function isDanger(pos) {
    return dangerCells.some(function (d) { return same(d, pos); });
  }

  /* 어떤 칸에서 다른 칸까지 가는 가장 짧은 길을 찾아줘요.
     (미로에서 길 찾기는 '너비 우선 탐색'이라는 방법을 써요.
      가까운 칸부터 하나씩 넓게 퍼져나가며 찾는 방법이에요.) */
  function findPath(from, to) {
    const came = {};                       // 어디에서 왔는지 적어두는 곳
    const queue = [from];
    came[from.r + ',' + from.c] = null;

    while (queue.length > 0) {
      const now = queue.shift();
      if (same(now, to)) break;            // 목적지에 도착했어요!

      const around = [
        { r: now.r - 1, c: now.c },
        { r: now.r + 1, c: now.c },
        { r: now.r, c: now.c - 1 },
        { r: now.r, c: now.c + 1 },
      ];

      for (const next of around) {
        const key = next.r + ',' + next.c;
        if (isOpen(next.r, next.c) && came[key] === undefined) {
          came[key] = now;
          queue.push(next);
        }
      }
    }

    // 도착지에서 거꾸로 되짚어서 길을 완성해요
    const path = [];
    let cur = to;
    while (cur && came[cur.r + ',' + cur.c] !== undefined) {
      path.unshift(cur);
      cur = came[cur.r + ',' + cur.c];
    }
    return path;   // [첫걸음, 둘째걸음, ... , 도착]
  }


  /* ----------------------------------------------------------------
     4. 화면 그리기
     ---------------------------------------------------------------- */

  /* 어떤 칸의 화면 위치를 알려줘요 (퍼센트로) */
  function cellStyle(pos) {
    return 'left:' + (pos.c * 100 / COLS) + '%;' +
           'top:'  + (pos.r * 100 / ROWS) + '%;';
  }

  /* 주인공을 지금 칸으로 옮겨요 */
  function drawHero() {
    node.hero.style.left = (hero.c * 100 / COLS) + '%';
    node.hero.style.top  = (hero.r * 100 / ROWS) + '%';
    node.hero.classList.toggle('has-flag', taken.length > 0);
  }

  /* 순찰 경찰들을 지금 칸으로 옮겨요 */
  function drawPatrols() {
    patrols.forEach(function (cop) {
      cop.node.style.left = (cop.pos.c * 100 / COLS) + '%';
      cop.node.style.top  = (cop.pos.r * 100 / ROWS) + '%';
    });
  }

  /* 위쪽에 남은 태극기 개수를 그려요 */
  function drawCount() {
    let html = '';
    for (let i = 0; i < FLAGS.length; i++) {
      html += '<span class="m3-mark' +
              (taken.indexOf(i) !== -1 ? ' is-got' : '') + '"></span>';
    }
    node.count.innerHTML = html;
    node.countText.textContent = '찾은 태극기 ' + taken.length + ' / ' + FLAGS.length;
  }

  /* 위쪽 안내 글을 바꿔요 */
  function setNotice(text, kind) {
    node.notice.textContent = text;
    node.notice.className = 'm3-notice' + (kind ? ' is-' + kind : '');
  }


  /* ----------------------------------------------------------------
     5. 주인공 움직이기
     ---------------------------------------------------------------- */
  function moveHero(now) {
    if (now < heroTimer) return;         // 아직 다음 걸음 차례가 아니에요

    let dr = 0, dc = 0;
    if (Input.dir.up)         dr = -1;
    else if (Input.dir.down)  dr = 1;
    else if (Input.dir.left)  dc = -1;
    else if (Input.dir.right) dc = 1;

    if (dr === 0 && dc === 0) return;    // 아무 방향도 안 눌렀어요

    const next = { r: hero.r + dr, c: hero.c + dc };
    if (!isOpen(next.r, next.c)) return; // 벽이라서 못 가요

    hero = next;
    heroTimer = now + HERO_STEP;
    drawHero();

    /* --- 보초의 경계 구역에 들어갔나요? --- */
    if (isDanger(hero)) {
      lose('보초를 서던 일본 경찰에게 들켰어요!');
      return;
    }

    /* --- 태극기가 숨겨진 칸에 도착했나요? --- */
    FLAGS.forEach(function (flag, i) {
      if (taken.indexOf(i) !== -1) return;      // 이미 주운 태극기예요
      if (!same(hero, flag)) return;

      taken.push(i);
      node.flags[i].classList.add('is-taken');
      drawCount();
      if (window.Sound) Sound.ding();

      const left = FLAGS.length - taken.length;
      if (left > 0) {
        setNotice('태극기를 찾았다!  아직 ' + left + '장 더 남았다.', 'good');
      } else {
        node.safe.classList.add('is-active');
        setNotice('다섯 장을 모두 찾았다! 안전한 곳으로 옮겨라.', 'good');
      }
      drawHero();
    });

    /* --- 태극기를 모두 들고 안전한 곳에 도착했나요? --- */
    if (taken.length >= FLAGS.length && same(hero, SAFE)) {
      running = false;
      setNotice('태극기 다섯 장을 모두 안전하게 지켜냈다!', 'good');
      setTimeout(onSuccess, 900);
    }
  }


  /* ----------------------------------------------------------------
     6. 순찰 경찰 움직이기
     ---------------------------------------------------------------- */
  function movePatrols(now) {
    patrols.forEach(function (cop) {
      if (now < cop.nextMove) return;    // 아직 움직일 차례가 아니에요
      cop.nextMove = now + PATROL_STEP;

      let target = cop.route[cop.routeIndex];

      // 순찰 지점에 도착했으면 다음 지점으로 방향을 바꿔요
      if (same(cop.pos, target)) {
        cop.routeIndex = (cop.routeIndex + 1) % cop.route.length;
        target = cop.route[cop.routeIndex];
      }

      const path = findPath(cop.pos, target);
      if (path.length > 0) cop.pos = path[0];   // 한 칸만 움직여요
    });

    drawPatrols();

    // 순찰 경찰과 부딪혔나요?
    for (const cop of patrols) {
      if (same(cop.pos, hero)) {
        lose('순찰하던 일본 경찰과 마주쳤어요!');
        return;
      }
    }
  }


  /* ----------------------------------------------------------------
     7. 들켰을 때
     ---------------------------------------------------------------- */
  function lose(reason) {
    running = false;
    node.hero.classList.add('is-caught');
    setNotice(reason, 'bad');
    setTimeout(function () { onFail(reason); }, 800);
  }


  /* ----------------------------------------------------------------
     8. 1초에 60번 반복되는 게임의 심장
     ---------------------------------------------------------------- */
  function loop(now) {
    if (!running) return;

    const delta = Math.min(now - lastTime, 50);
    lastTime = now;

    if (game.paused) {                   // 잠시 멈춤 중이면 쉬어요
      // 멈춘 동안 시간이 흐르지 않게 시각을 뒤로 미뤄요
      heroTimer += delta;
      patrols.forEach(function (cop) { cop.nextMove += delta; });
      requestAnimationFrame(loop);
      return;
    }

    moveHero(now);
    if (running) movePatrols(now);
    if (running) requestAnimationFrame(loop);
  }


  /* ----------------------------------------------------------------
     9. 미션 시작하기
     ---------------------------------------------------------------- */
  function start(success, fail) {
    onSuccess = success;
    onFail = fail;

    hero = { r: START.r, c: START.c };
    taken = [];
    running = true;
    heroTimer = 0;
    dangerCells = makeDangerCells();

    /* --- 미로 벽을 그려요 --- */
    let html = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (MAZE[r][c] === '#') {
          html += '<div class="m3-wall" style="' + cellStyle({ r: r, c: c }) + '"></div>';
        }
      }
    }

    /* --- 보초의 경계 구역을 빨갛게 칠해요 --- */
    dangerCells.forEach(function (d) {
      html += '<div class="m3-danger" style="' + cellStyle(d) + '"></div>';
    });

    /* --- 태극기 5장과 안전한 곳 --- */
    FLAGS.forEach(function (flag, i) {
      html += '<div class="m3-item m3-flagcell" data-flag="' + i + '" style="' +
              cellStyle(flag) + '"></div>';
    });
    html += '<div class="m3-item m3-safecell" style="' + cellStyle(SAFE) + '"></div>';

    /* --- 보초 경찰 (가만히 서 있어요) --- */
    GUARDS.forEach(function (g) {
      html += '<div class="m3-actor m3-guard" style="' + cellStyle(g) + '">' +
              MissionUtil.figure('police', 'is-looking') + '</div>';
    });

    /* --- 순찰 경찰 (움직여요) --- */
    PATROLS.forEach(function (route, i) {
      html += '<div class="m3-actor m3-cop" data-cop="' + i + '" style="' +
              cellStyle(route[0]) + '">' + MissionUtil.figure('police') + '</div>';
    });

    /* --- 주인공 --- */
    html += '<div class="m3-actor m3-hero" style="' + cellStyle(START) + '">' +
            MissionUtil.figure('hero') + '</div>';

    const stage = MissionUtil.setStage(
      '<div class="m3-scene">' +
        '<div class="m3-head">' +
          '<span class="m3-count"></span>' +
          '<span class="m3-count-text"></span>' +
        '</div>' +
        '<p class="m3-notice">숨겨진 태극기 다섯 장을 모두 찾아라. 붉은 곳은 보초가 지키고 있다.</p>' +
        '<div class="m3-maze" style="--cols:21;--rows:13">' + html + '</div>' +
        '<p class="m3-tip">' +
          '<span class="m3-key">스틱</span> 네 방향 이동 &nbsp;·&nbsp; ' +
          '<span class="m3-legend m3-legend-guard"></span> 보초(붉은 곳 금지) &nbsp;·&nbsp; ' +
          '<span class="m3-legend m3-legend-cop"></span> 순찰(부딪히면 들킴)' +
        '</p>' +
      '</div>'
    );

    node = {
      notice:    stage.querySelector('.m3-notice'),
      hero:      stage.querySelector('.m3-hero'),
      flags:     Array.prototype.slice.call(stage.querySelectorAll('.m3-flagcell')),
      safe:      stage.querySelector('.m3-safecell'),
      count:     stage.querySelector('.m3-count'),
      countText: stage.querySelector('.m3-count-text'),
    };

    /* 순찰 경찰들의 처음 상태를 정해요 */
    patrols = PATROLS.map(function (route, i) {
      return {
        pos: { r: route[0].r, c: route[0].c },
        route: route,
        routeIndex: 1,          // 다음에 갈 순찰 지점
        nextMove: 0,
        node: stage.querySelector('[data-cop="' + i + '"]'),
      };
    });

    drawHero();
    drawPatrols();
    drawCount();

    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
  }


  return {
    start: start,
    stop: stop,
    hint: '미로에 숨겨진 태극기 다섯 장을 모두 찾아 안전한 곳으로 옮겨라. 붉은 곳은 보초가 지킨다.',
  };
})();


/* ===== js/ch4.js ===== */
/* ==================================================================
   4장 · 만세운동 준비  (ch4.js)

   유관순을 만나 만세운동을 준비해요.
   광장에 모인 사람들에게 태극기를 나누어 주고
   독립의 뜻을 알리면 성공이에요.

   - 태극기 하나를 전할 때마다 독립 포인트 +3점 (5명이면 15점)
   - 3장 미로와 달리 칸이 없어요. 광장을 자유롭게 걸어 다녀요.

   조작 : 스틱(방향키)으로 걸어다니고
          사람 곁에 다가가서 2번 버튼(말걸기)을 눌러요
   ================================================================== */

MISSIONS[4] = (function () {

  /* ----------------------------------------------------------------
     1. 광장에 모인 사람들
        x, y 는 광장 안에서의 자리예요 (0~100 사이의 값)
        say 는 태극기를 받고 하는 말이에요
     ---------------------------------------------------------------- */
  const PEOPLE = [
    { x: 20, y: 24, say: '고맙습니다! 이 깃발을 꼭 들겠습니다.' },
    { x: 47, y: 15, say: '우리 손으로 나라를 되찾읍시다.' },
    { x: 76, y: 28, say: '아이들에게도 나누어 주겠소.' },
    { x: 30, y: 72, say: '두렵지만, 함께라면 할 수 있습니다.' },
    { x: 72, y: 76, say: '대한 독립 만세!' },
  ];

  const YU = { x: 50, y: 47 };      // 유관순이 서 있는 자리
  const POINT_PER_FLAG = 3;         // 태극기 하나를 전할 때마다 주는 점수
  const REACH = 11;                 // 이만큼 가까이 가야 말을 걸 수 있어요

  /* 걷는 빠르기 (1초에 몇 칸 가는지)
     광장이 가로로 길어서, 위아래는 조금 더 빠르게 해야
     걷는 느낌이 똑같아 보여요. */
  const SPEED_X = 32;
  const SPEED_Y = 56;


  /* ----------------------------------------------------------------
     2. 이 미션이 기억해야 할 것들
     ---------------------------------------------------------------- */
  let hero = { x: 50, y: 88 };   // 주인공은 광장 아래쪽에서 시작해요
  let people = [];               // 사람 5명의 상태
  let given = 0;                 // 지금까지 나눠준 태극기 수
  let nearest = -1;              // 지금 가장 가까운 사람 번호 (없으면 -1)
  let running = false;
  let lastTime = 0;
  let onSuccess = null;
  let node = {};


  /* ----------------------------------------------------------------
     3. 도우미
     ---------------------------------------------------------------- */

  /* 두 자리가 얼마나 떨어져 있는지 재요.
     광장이 가로로 기니까 세로 거리는 조금 크게 쳐줘요. */
  function distance(a, b) {
    const dx = a.x - b.x;
    const dy = (a.y - b.y) * 0.55;
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* 숫자를 0~100 사이로 붙잡아 둬요 (광장 밖으로 못 나가게) */
  function inField(value) {
    return MissionUtil.clamp(value, 4, 96);
  }


  /* ----------------------------------------------------------------
     4. 화면 그리기
     ---------------------------------------------------------------- */

  function drawHero() {
    node.hero.style.left = hero.x + '%';
    node.hero.style.top  = hero.y + '%';
  }

  /* 남은 태극기 개수를 보여줘요 */
  function drawCount() {
    const left = PEOPLE.length - given;
    node.count.innerHTML = '';
    for (let i = 0; i < PEOPLE.length; i++) {
      node.count.innerHTML +=
        '<span class="m4-flagmark' + (i < left ? '' : ' is-used') + '"></span>';
    }
    node.countText.textContent = '남은 태극기 ' + left + '개';
  }

  /* 가장 가까운 사람을 찾아서, 말을 걸 수 있으면 표시해줘요 */
  function updateNearest() {
    let best = -1;
    let bestDist = REACH;

    people.forEach(function (person, i) {
      if (person.done) return;                  // 이미 준 사람은 넘어가요
      const d = distance(hero, PEOPLE[i]);
      if (d < bestDist) { bestDist = d; best = i; }
    });

    if (best === nearest) return;               // 달라진 게 없으면 그냥 둬요
    nearest = best;

    // 모든 사람의 '말걸기' 표시를 껐다가
    people.forEach(function (person) {
      person.node.classList.remove('is-near');
    });
    // 가장 가까운 한 사람만 켜요
    if (nearest >= 0) people[nearest].node.classList.add('is-near');
  }


  /* ----------------------------------------------------------------
     5. 태극기 건네주기 (2번 버튼 · 말걸기)
     ---------------------------------------------------------------- */
  function giveFlag() {
    if (!running) return;
    if (nearest < 0) {
      // 아무도 곁에 없어요
      node.talk.textContent = '사람들 곁으로 다가가야 한다.';
      node.talk.className = 'm4-talk';
      return;
    }

    const person = people[nearest];
    person.done = true;
    person.node.classList.remove('is-near');
    person.node.classList.add('is-done');       // 태극기를 든 모습으로 바뀌어요

    given += 1;
    addScore(POINT_PER_FLAG);                   // 한 명당 3점!
    drawCount();

    node.talk.textContent = '「 ' + PEOPLE[nearest].say + ' 」';
    node.talk.className = 'm4-talk is-good';

    nearest = -1;

    /* 다섯 명 모두에게 나누어 주었나요? */
    if (given >= PEOPLE.length) {
      running = false;
      node.talk.textContent = '유관순 : 이제 다 함께 만세를 부를 때입니다!';
      node.field.classList.add('is-ready');     // 광장이 환해져요
      if (window.Sound) Sound.fanfare();
      setTimeout(onSuccess, 1600);
    }
  }


  /* ----------------------------------------------------------------
     6. 1초에 60번 반복되는 게임의 심장
     ---------------------------------------------------------------- */
  function loop(now) {
    if (!running) return;

    const delta = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (game.paused) {                // 잠시 멈춤 중이면 쉬어요
      requestAnimationFrame(loop);
      return;
    }

    // 방향키를 누른 만큼 걸어가요 (네 방향 모두 돼요)
    if (Input.dir.left)  hero.x = inField(hero.x - SPEED_X * delta);
    if (Input.dir.right) hero.x = inField(hero.x + SPEED_X * delta);
    if (Input.dir.up)    hero.y = inField(hero.y - SPEED_Y * delta);
    if (Input.dir.down)  hero.y = inField(hero.y + SPEED_Y * delta);

    drawHero();
    updateNearest();

    requestAnimationFrame(loop);
  }


  /* ----------------------------------------------------------------
     7. 미션 시작하기
     ---------------------------------------------------------------- */
  function start(success) {
    onSuccess = success;

    hero = { x: 50, y: 88 };
    given = 0;
    nearest = -1;
    running = true;

    /* --- 사람 5명을 그려요 --- */
    let peopleHtml = '';
    PEOPLE.forEach(function (person, i) {
      peopleHtml +=
        '<div class="m4-person" data-person="' + i + '" ' +
             'style="left:' + person.x + '%;top:' + person.y + '%">' +
          MissionUtil.figure('mate') +
          '<span class="m4-bubble">2</span>' +   // 말걸기 표시
          '<span class="m4-gotflag"></span>' +   // 받은 태극기
        '</div>';
    });

    const stage = MissionUtil.setStage(
      '<div class="m4-scene">' +

        '<div class="m4-head">' +
          '<span class="m4-count"></span>' +
          '<span class="m4-count-text"></span>' +
        '</div>' +

        '<div class="m4-field">' +
          peopleHtml +
          // 유관순은 광장 가운데에 서 있어요
          '<div class="m4-yu" style="left:' + YU.x + '%;top:' + YU.y + '%">' +
            MissionUtil.figure('yu', 'is-looking') +
            '<span class="m4-name">유관순</span>' +
          '</div>' +
          '<div class="m4-hero" style="left:' + hero.x + '%;top:' + hero.y + '%">' +
            MissionUtil.figure('hero') +
          '</div>' +
        '</div>' +

        '<p class="m4-talk">유관순 : 이 태극기를 사람들에게 나누어 주세요.</p>' +
        '<p class="m4-tip">' +
          '<span class="m3-key">스틱</span> 걸어다니기 &nbsp;·&nbsp; ' +
          '<span class="m3-key">2번</span> 곁에 있는 사람에게 태극기 건네기' +
        '</p>' +

      '</div>'
    );

    node = {
      field:     stage.querySelector('.m4-field'),
      hero:      stage.querySelector('.m4-hero'),
      count:     stage.querySelector('.m4-count'),
      countText: stage.querySelector('.m4-count-text'),
      talk:      stage.querySelector('.m4-talk'),
    };

    people = PEOPLE.map(function (person, i) {
      return {
        done: false,
        node: stage.querySelector('[data-person="' + i + '"]'),
      };
    });

    drawHero();
    drawCount();

    // 2번 버튼(말걸기)으로 태극기를 건네요
    Input.on('talk', giveFlag);
    Input.on('next', giveFlag);        // 4번 버튼으로도 돼요

    // 마우스로 사람을 눌러도 태극기를 줄 수 있어요
    people.forEach(function (person, i) {
      person.node.addEventListener('click', function () {
        if (person.done) return;
        // 그 사람 곁으로 순간 이동한 것처럼 처리해요
        hero.x = PEOPLE[i].x;
        hero.y = PEOPLE[i].y + 8;
        drawHero();
        updateNearest();
        giveFlag();
      });
    });

    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
  }


  return {
    start: start,
    stop: stop,
    hint: '광장을 돌아다니며 사람들에게 태극기를 나누어 주어라. 곁에 서서 2번 버튼을 누른다.',
  };
})();


/* ===== js/ch5.js ===== */
/* ==================================================================
   5장 · 독립을 향하여  (ch5.js)

   주인공과 김구 선생님, 독립군이 마지막 싸움을 준비해요.
   일본 헌병대장과 맞서 싸워 이기면 광복이 눈앞이에요!

   ★ 싸우는 방법 : 막고 치기

     1) 헌병대장이 「준비」 자세를 취해요  → 곧 공격해요!
     2) 「공격」 할 때 1번 버튼으로 점프해서 피해요
     3) 공격이 빗나가면 「빈틈」 이 생겨요 → 3번 버튼으로 공격!
     4) 헌병대장의 기력을 모두 없애면 승리 (+30점)

     ※ 빈틈이 아닐 때 공격하면 헛손질을 해서 잠깐 움직이지 못해요.
        아무 때나 마구 누르면 안 돼요!
   ================================================================== */

MISSIONS[5] = (function () {

  /* ----------------------------------------------------------------
     1. 싸움 규칙 숫자들
     ---------------------------------------------------------------- */
  const BOSS_HP = 5;        // 헌병대장의 기력
  const HERO_HP = 3;        // 주인공의 기력

  const JUMP_TIME  = 620;   // 점프해서 공중에 떠 있는 시간 (밀리초)
  const MISS_TIME  = 420;   // 헛손질하고 굳어 있는 시간
  const HIT_FLASH  = 260;   // 맞았을 때 번쩍이는 시간

  /* 헌병대장의 동작 시간 (기력이 줄수록 점점 빨라져요) */
  const IDLE_TIME   = [900, 500];   // 처음 900 → 마지막 500
  const READY_TIME  = [780, 430];   // 「준비」 신호를 보여주는 시간
  const STRIKE_TIME = [300, 240];   // 내려치는 시간
  const OPEN_TIME   = [900, 620];   // 빈틈이 생기는 시간


  /* ----------------------------------------------------------------
     2. 이 미션이 기억해야 할 것들
     ---------------------------------------------------------------- */
  let bossHp = 0;
  let heroHp = 0;
  let bossState = '';       // idle · ready · strike · open
  let stateTimer = 0;       // 지금 동작이 끝날 때까지 남은 시간
  let jumpUntil = 0;        // 이 시각까지 공중에 떠 있어요
  let missUntil = 0;        // 이 시각까지 헛손질로 굳어 있어요
  let struck = false;       // 이번 공격이 이미 판정됐는지
  let running = false;
  let lastTime = 0;
  let onSuccess = null;
  let onFail = null;
  let node = {};


  /* ----------------------------------------------------------------
     3. 도우미
     ---------------------------------------------------------------- */

  /* 기력이 줄수록 동작이 빨라지게 시간을 계산해요.
     range 는 [처음시간, 마지막시간] 이에요. */
  function speedOf(range) {
    const gone = (BOSS_HP - bossHp) / BOSS_HP;   // 0 에서 시작해 1까지
    return range[0] + (range[1] - range[0]) * gone;
  }

  /* 지금 공중에 떠 있나요? */
  function isJumping(now) { return now < jumpUntil; }

  /* 지금 헛손질로 굳어 있나요? */
  function isStiff(now) { return now < missUntil; }


  /* ----------------------------------------------------------------
     4. 화면 그리기
     ---------------------------------------------------------------- */

  /* 기력 막대를 그려요 */
  function drawHp() {
    let bossHtml = '';
    for (let i = 0; i < BOSS_HP; i++) {
      bossHtml += '<span class="m5-pip' + (i < bossHp ? '' : ' is-lost') + '"></span>';
    }
    node.bossHp.innerHTML = bossHtml;

    let heroHtml = '';
    for (let i = 0; i < HERO_HP; i++) {
      heroHtml += '<span class="m5-pip is-mine' + (i < heroHp ? '' : ' is-lost') + '"></span>';
    }
    node.heroHp.innerHTML = heroHtml;
  }

  /* 헌병대장의 지금 동작을 화면에 보여줘요 */
  function drawBoss() {
    const words = {
      idle:   '……',
      ready:  '준비!  곧 공격한다',
      strike: '공격!  점프로 피해라',
      open:   '빈틈!  지금 공격하라',
    };

    node.boss.className = 'm5-boss is-' + bossState;
    node.signal.className = 'm5-signal is-' + bossState;
    node.signal.textContent = words[bossState];

    // 이쪽을 노려볼 때만 눈이 켜져요
    node.bossFig.classList.toggle('is-looking',
      bossState === 'ready' || bossState === 'strike');
  }

  /* 주인공의 모습을 바꿔요 */
  function drawHero(now) {
    node.hero.classList.toggle('is-jumping', isJumping(now));
    node.hero.classList.toggle('is-stiff', isStiff(now));
  }

  function setTalk(text, kind) {
    node.talk.textContent = text;
    node.talk.className = 'm5-talk' + (kind ? ' is-' + kind : '');
  }


  /* ----------------------------------------------------------------
     5. 헌병대장의 동작 바꾸기
     ---------------------------------------------------------------- */
  function nextBossState() {
    if (bossState === 'idle') {
      bossState = 'ready';
      stateTimer = speedOf(READY_TIME);
      if (window.Sound) Sound.alert();       // 삐빅! 곧 공격해요

    } else if (bossState === 'ready') {
      bossState = 'strike';
      stateTimer = speedOf(STRIKE_TIME);
      struck = false;                        // 이번 공격은 아직 판정 안 했어요

    } else if (bossState === 'strike') {
      bossState = 'open';
      stateTimer = speedOf(OPEN_TIME);

    } else {
      bossState = 'idle';
      stateTimer = speedOf(IDLE_TIME);
    }

    drawBoss();
  }


  /* ----------------------------------------------------------------
     6. 주인공의 행동
     ---------------------------------------------------------------- */

  /* 1번 버튼 : 점프해서 피하기 */
  function jump() {
    if (!running) return;
    const now = performance.now();
    if (isJumping(now) || isStiff(now)) return;   // 이미 뛰었거나 굳었으면 못 해요

    jumpUntil = now + JUMP_TIME;
    drawHero(now);
  }

  /* 3번 버튼 : 공격하기 */
  function attack() {
    if (!running) return;
    const now = performance.now();
    if (isStiff(now)) return;

    if (bossState === 'open') {
      /* ---- 빈틈을 정확히 노렸어요! ---- */
      bossHp -= 1;
      drawHp();
      node.boss.classList.add('is-hurt');
      setTimeout(function () { node.boss.classList.remove('is-hurt'); }, HIT_FLASH);

      if (window.Sound) Sound.ding();
      setTalk('명중! 헌병대장이 물러선다.', 'good');

      if (bossHp <= 0) { win(); return; }

      // 맞으면 바로 다음 동작으로 넘어가요
      bossState = 'idle';
      stateTimer = speedOf(IDLE_TIME);
      drawBoss();

    } else {
      /* ---- 빈틈이 아닌데 휘둘렀어요 ---- */
      missUntil = now + MISS_TIME;
      setTalk('헛손질! 잠시 움직일 수 없다.', 'bad');
      drawHero(now);
    }
  }


  /* ----------------------------------------------------------------
     7. 맞았을 때 / 이겼을 때 / 졌을 때
     ---------------------------------------------------------------- */
  function heroHit() {
    heroHp -= 1;
    drawHp();

    node.hero.classList.add('is-hurt');
    setTimeout(function () { node.hero.classList.remove('is-hurt'); }, HIT_FLASH);

    if (window.Sound) Sound.ppyong();

    if (heroHp <= 0) { lose(); return; }
    setTalk('공격에 맞았다! 다음엔 점프로 피하자.', 'bad');
  }

  function win() {
    running = false;
    node.boss.classList.add('is-down');
    node.signal.className = 'm5-signal';
    node.signal.textContent = '';
    setTalk('일본 헌병대장을 물리쳤다! 광복이 눈앞이다.', 'good');
    if (window.Sound) Sound.fanfare();
    setTimeout(onSuccess, 1500);
  }

  function lose() {
    running = false;
    setTalk('기력이 다했다...', 'bad');
    setTimeout(function () {
      onFail('일본 헌병대장과의 싸움에서 힘이 다했어요!');
    }, 900);
  }


  /* ----------------------------------------------------------------
     8. 1초에 60번 반복되는 게임의 심장
     ---------------------------------------------------------------- */
  function loop(now) {
    if (!running) return;

    const delta = Math.min(now - lastTime, 50);
    lastTime = now;

    if (game.paused) {                 // 잠시 멈춤 중이면 시간을 멈춰요
      jumpUntil += delta;
      missUntil += delta;
      requestAnimationFrame(loop);
      return;
    }

    /* 헌병대장의 동작 시간을 줄여요 */
    stateTimer -= delta;
    if (stateTimer <= 0) nextBossState();

    /* 내려치는 순간에 딱 한 번만 맞았는지 확인해요 */
    if (bossState === 'strike' && !struck) {
      struck = true;
      if (!isJumping(now)) heroHit();       // 공중에 없으면 맞아요!
      else setTalk('잘 피했다!', 'good');
    }

    drawHero(now);
    if (running) requestAnimationFrame(loop);
  }


  /* ----------------------------------------------------------------
     9. 미션 시작하기
     ---------------------------------------------------------------- */
  function start(success, fail) {
    onSuccess = success;
    onFail = fail;

    bossHp = BOSS_HP;
    heroHp = HERO_HP;
    bossState = 'idle';
    stateTimer = 1200;                 // 처음에는 조금 여유를 줘요
    jumpUntil = 0;
    missUntil = 0;
    running = true;

    const stage = MissionUtil.setStage(
      '<div class="m5-scene">' +

        // 위쪽 : 양쪽 기력 막대
        '<div class="m5-bars">' +
          '<div class="m5-side">' +
            '<span class="m5-who">주인공</span>' +
            '<span class="m5-hp m5-hero-hp"></span>' +
          '</div>' +
          '<div class="m5-side m5-right">' +
            '<span class="m5-hp m5-boss-hp"></span>' +
            '<span class="m5-who">일본 헌병대장</span>' +
          '</div>' +
        '</div>' +

        // 가운데 : 싸움터
        '<div class="m5-arena">' +
          '<div class="m5-signal"></div>' +
          '<div class="m5-ground"></div>' +
          '<div class="m5-hero">' + MissionUtil.figure('hero') + '</div>' +
          '<div class="m5-boss is-idle">' +
            MissionUtil.figure('captain') +
            '<span class="m5-blade"></span>' +      // 내려치는 칼
          '</div>' +
        '</div>' +

        '<p class="m5-talk">마지막 싸움이다. 겁먹지 말자.</p>' +
        '<p class="m5-tip">' +
          '<span class="m3-key">1번</span> 점프해서 피하기 &nbsp;·&nbsp; ' +
          '<span class="m3-key">3번</span> 빈틈에 공격하기' +
        '</p>' +

      '</div>'
    );

    node = {
      boss:    stage.querySelector('.m5-boss'),
      bossFig: stage.querySelector('.m5-boss .fig'),
      hero:    stage.querySelector('.m5-hero'),
      signal:  stage.querySelector('.m5-signal'),
      bossHp:  stage.querySelector('.m5-boss-hp'),
      heroHp:  stage.querySelector('.m5-hero-hp'),
      talk:    stage.querySelector('.m5-talk'),
    };

    drawHp();
    drawBoss();

    /* 버튼을 연결해요 */
    Input.on('jump',   jump);      // 1번 : 점프
    Input.on('attack', attack);    // 3번 : 공격

    /* 마우스로도 싸울 수 있어요 (왼쪽 절반=점프, 오른쪽 절반=공격) */
    stage.querySelector('.m5-arena').addEventListener('pointerdown', function (e) {
      const box = e.currentTarget.getBoundingClientRect();
      if (e.clientX - box.left < box.width / 2) jump();
      else attack();
    });

    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
  }


  return {
    start: start,
    stop: stop,
    hint: '「준비」 뒤 공격이 온다. 1번으로 점프해 피하고, 「빈틈」에 3번으로 공격하라.',
  };
})();


/* ===== js/ch6.js ===== */
/* ==================================================================
   6장 · 광복의 날  (ch6.js)

   마지막 장이에요. 싸우는 미션이 아니라 함께 기뻐하는 장면이에요.

   ★ 두 가지가 함께 일어나요
     1) 이야기가 한 줄씩 저절로 흘러가요 (가만히 보면 돼요)
     2) 스틱을 좌우로 흔들면 태극기가 펄럭이고,
        흔들수록 밤하늘이 새벽으로 밝아져요!

   하늘이 완전히 밝아지면 광복이 이루어지고 게임이 끝나요.

   조작 : 스틱(방향키)을 좌우로 번갈아 흔들기
          마우스를 좌우로 움직여도 돼요
   ================================================================== */

MISSIONS[6] = (function () {

  /* ----------------------------------------------------------------
     1. 광장에 모인 사람들
        누구인지와, 화면 어디에 설지 정해요.
     ---------------------------------------------------------------- */
  const CROWD = [
    { who: 'mate',    x: 12, size: 0.85 },
    { who: 'kimgu',   x: 28, size: 1.0  },
    { who: 'hero',    x: 45, size: 1.15 },   // 주인공은 가운데, 조금 크게
    { who: 'yu',      x: 62, size: 1.0  },
    { who: 'mate',    x: 78, size: 0.85 },
    { who: 'hero',    x: 91, size: 0.75 },
  ];

  /* 한 줄씩 흘러갈 이야기예요 (기획서에 적힌 그대로) */
  const STORY = [
    '1945년 8월 15일.',
    '일본의 지배에서 벗어나, 조선이 광복을 맞이했다.',
    '사람들은 거리로 나와 태극기를 흔들었다.',
    '주인공도 독립운동가들과 함께 자유를 되찾은 기쁨을 나누었다.',
    '대한 독립 만세!',
  ];

  const STORY_GAP = 2600;    // 이야기 한 줄이 머무는 시간 (밀리초)
  const SHAKE_ADD = 7;       // 한 번 흔들 때마다 밝아지는 정도
  const DAWN_FADE = 3;       // 흔들지 않으면 1초에 이만큼씩 다시 어두워져요


  /* ----------------------------------------------------------------
     2. 이 미션이 기억해야 할 것들
     ---------------------------------------------------------------- */
  let dawn = 0;              // 하늘이 얼마나 밝아졌는지 (0 ~ 100)
  let lastSide = '';         // 마지막으로 흔든 방향 (좌 / 우)
  let storyIndex = 0;
  let storyTimer = 0;
  let running = false;
  let done = false;          // 광복이 이루어졌는지
  let lastTime = 0;
  let lastMouseX = null;
  let onSuccess = null;
  let node = {};


  /* ----------------------------------------------------------------
     3. 태극기 흔들기
        ★ 왼쪽 → 오른쪽 → 왼쪽 ... 번갈아 흔들어야 세어져요.
          한쪽만 계속 누르고 있으면 안 돼요!
     ---------------------------------------------------------------- */
  function shake(side) {
    if (!running || done) return;
    if (side === lastSide) return;      // 같은 쪽을 또 흔들면 안 세요

    lastSide = side;
    dawn = MissionUtil.clamp(dawn + SHAKE_ADD, 0, 100);

    // 태극기가 펄럭여요
    node.scene.classList.remove('is-waving');
    void node.scene.offsetWidth;        // 애니메이션을 처음부터 다시 틀어요
    node.scene.classList.add('is-waving');

    if (window.Sound) Sound.pok();
    drawDawn();

    if (dawn >= 100) liberate();        // 하늘이 다 밝아졌어요!
  }


  /* ----------------------------------------------------------------
     4. 화면 그리기
     ---------------------------------------------------------------- */

  /* 하늘 밝기와 게이지를 화면에 그려요 */
  function drawDawn() {
    node.scene.style.setProperty('--dawn', dawn / 100);
    node.gaugeFill.style.width = dawn + '%';
  }

  /* 이야기 한 줄을 보여줘요 */
  function showStory() {
    node.story.textContent = STORY[storyIndex];

    // 글자가 스르륵 나타나게 해요
    node.story.classList.remove('is-in');
    void node.story.offsetWidth;
    node.story.classList.add('is-in');

    storyIndex += 1;

    // 이야기가 다 끝났는데 아직 하늘이 어두우면 살짝 알려줘요
    if (storyIndex >= STORY.length) {
      node.hint.textContent = '태극기를 흔들어 새벽을 맞이하라  (스틱 좌 · 우)';
    }
  }


  /* ----------------------------------------------------------------
     5. 광복!
     ---------------------------------------------------------------- */
  function liberate() {
    done = true;
    running = false;

    // 화면 전체가 환하게 바뀌어요 ☀️
    document.body.classList.add('liberation');
    node.scene.classList.add('is-free');

    node.story.textContent = '대한 독립 만세!';
    node.story.classList.add('is-big');
    node.hint.textContent = '';

    if (window.Sound) Sound.fanfare();

    setTimeout(onSuccess, 2200);
  }


  /* ----------------------------------------------------------------
     6. 1초에 60번 반복되는 게임의 심장
     ---------------------------------------------------------------- */
  function loop(now) {
    if (!running) return;

    const delta = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (game.paused) {
      requestAnimationFrame(loop);
      return;
    }

    /* 이야기를 한 줄씩 넘겨요 */
    if (storyIndex < STORY.length) {
      storyTimer -= delta * 1000;
      if (storyTimer <= 0) {
        showStory();
        storyTimer = STORY_GAP;
      }
    }

    /* 흔들기를 멈추면 하늘이 조금씩 다시 어두워져요 */
    if (dawn > 0 && dawn < 100) {
      dawn = MissionUtil.clamp(dawn - DAWN_FADE * delta, 0, 100);
      drawDawn();
    }

    requestAnimationFrame(loop);
  }


  /* ----------------------------------------------------------------
     7. 미션 시작하기
     ---------------------------------------------------------------- */
  function start(success) {
    onSuccess = success;

    dawn = 0;
    lastSide = '';
    storyIndex = 0;
    storyTimer = 700;        // 잠깐 뒤에 첫 줄이 나와요
    done = false;
    running = true;
    lastMouseX = null;

    // 이 장은 어두운 밤에서 시작해요 (흔들어야 밝아져요)
    document.body.classList.remove('liberation');

    /* --- 사람들을 그려요 (모두 태극기를 들고 있어요) --- */
    let crowdHtml = '';
    CROWD.forEach(function (person) {
      crowdHtml +=
        '<div class="m6-person" style="left:' + person.x + '%;' +
             '--size:' + person.size + '">' +
          '<span class="m6-flag"></span>' +
          MissionUtil.figure(person.who) +
        '</div>';
    });

    const stage = MissionUtil.setStage(
      '<div class="m6-scene" style="--dawn:0">' +

        '<div class="m6-sky"></div>' +         // 밤 → 새벽으로 바뀌는 하늘
        '<div class="m6-sun"></div>' +         // 떠오르는 해
        '<div class="m6-crowd">' + crowdHtml + '</div>' +
        '<div class="m6-ground"></div>' +

        '<p class="m6-story"></p>' +
        '<p class="m6-hint">스틱을 좌 · 우로 흔들어 태극기를 펄럭여라</p>' +

        '<div class="m6-gauge"><div class="m6-gauge-fill"></div></div>' +

      '</div>'
    );

    node = {
      scene:     stage.querySelector('.m6-scene'),
      story:     stage.querySelector('.m6-story'),
      hint:      stage.querySelector('.m6-hint'),
      gaugeFill: stage.querySelector('.m6-gauge-fill'),
    };

    drawDawn();

    /* --- 스틱 좌우로 흔들기 --- */
    Input.on('dir:left',  function () { shake('left'); });
    Input.on('dir:right', function () { shake('right'); });

    /* --- 마우스를 좌우로 움직여도 흔들려요 --- */
    node.scene.addEventListener('pointermove', function (e) {
      if (lastMouseX === null) { lastMouseX = e.clientX; return; }
      const moved = e.clientX - lastMouseX;
      if (Math.abs(moved) < 26) return;      // 조금 움직인 건 세지 않아요
      shake(moved > 0 ? 'right' : 'left');
      lastMouseX = e.clientX;
    });

    /* --- 마우스로 눌러도 한 번 흔들려요 --- */
    node.scene.addEventListener('pointerdown', function () {
      shake(lastSide === 'left' ? 'right' : 'left');
    });

    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
  }


  return {
    start: start,
    stop: stop,
    hint: '드디어 광복의 날. 스틱을 좌우로 흔들어 태극기를 펄럭이면 새벽이 밝아온다.',
  };
})();

   독립을 향하여 - 게임의 뼈대 (game.js)

   이 파일이 하는 일
   1) 화면 3개(시작 / 게임 / 끝)를 바꿔 끼워요
   2) 독립 포인트(점수)를 기억하고 화면에 보여줘요
   3) 6개 장을 순서대로 진행시켜요

/* ------------------------------------------------------------------
   1. 게임이 기억해야 할 것들을 한곳에 모아뒀어요.

  paused: false,      // 잠깐 멈춤 중인지
};


/* ------------------------------------------------------------------

      id      : 장 번호
      name    : 점수판에 보여줄 이름
      face    : 말풍선에 나올 캐릭터 얼굴
      story   : 장이 시작될 때 들려줄 이야기

/* ------------------------------------------------------------------
   3. 화면에서 자주 쓰는 부분들을 미리 찾아둬요.
      (매번 찾으면 느려지니까 한 번만 찾아서 이름을 붙여요)
   ------------------------------------------------------------------ */
const el = {
  screens: {
    title: document.getElementById('screen-title'),
    game:  document.getElementById('screen-game'),
    end:   document.getElementById('screen-end'),
  },
  chapterName: document.getElementById('hud-chapter-name'),
  score:       document.getElementById('hud-score'),
  hearts:      document.getElementById('hud-hearts'),
  stage:       document.getElementById('stage-inner'),
  bubbleFace:  document.getElementById('bubble-face'),
  bubbleText:  document.getElementById('bubble-text'),
  endEmoji:    document.getElementById('end-emoji'),
  endTitle:    document.getElementById('end-title'),
  endMessage:  document.getElementById('end-message'),
  endScore:    document.getElementById('end-score'),
  btnStart:    document.getElementById('btn-start'),
  btnRetry:    document.getElementById('btn-retry'),
};


/* ------------------------------------------------------------------
   4. 화면 바꾸기
      showScreen('game') 이라고 부르면 게임 화면만 보여요.
   ------------------------------------------------------------------ */
function showScreen(name) {
  // 먼저 모든 화면을 숨겨요
  for (const key in el.screens) {
    el.screens[key].classList.remove('is-on');
  }
  // 그리고 원하는 화면 하나만 보여줘요
  el.screens[name].classList.add('is-on');
}


/* ------------------------------------------------------------------
   5. 점수 다루기
   ------------------------------------------------------------------ */

// 점수를 화면에 다시 그려요
function drawScore() {
  el.score.textContent = game.score;
}

// 점수를 올려요. 올라갈 때 숫자가 통통 튀어요!
function addScore(amount) {
  if (amount <= 0) return;      // 0점이면 아무 일도 안 해요
  game.score += amount;
  drawScore();
  Sound.ding();               // 띠링! 하고 기분 좋은 소리가 나요

  // 'pop' 이름표를 잠깐 붙였다 떼면 커졌다 작아지는 애니메이션이 나와요
  el.score.classList.remove('pop');
  void el.score.offsetWidth;    // 애니메이션을 처음부터 다시 트는 방법이에요
  el.score.classList.add('pop');
}


/* ------------------------------------------------------------------
   5-2. 목숨(하트) 다루기
   ------------------------------------------------------------------ */

// 남은 목숨만큼 빨간 하트, 잃은 만큼 까만 하트를 그려요
function drawHearts() {
  let html = '';
  for (let i = 0; i < MAX_LIFE; i++) {
    // 남아 있으면 붉은 마름모, 잃었으면 흐린 마름모
    html += '<span class="life-mark' + (i < game.life ? '' : ' is-lost') + '"></span>';
  }
  el.hearts.innerHTML = html;
}

// 일본 경찰에게 들켰을 때 부르는 함수예요
function caught(reason) {
  Sound.ppyong();          // 뿅... 하고 시무룩한 소리가 나요
  game.life -= 1;          // 하트가 하나 줄어요
  drawHearts();

  // 하트가 부르르 떨려요
  el.hearts.classList.remove('shake');
  void el.hearts.offsetWidth;
  el.hearts.classList.add('shake');

  // 하트를 다 잃으면 게임이 끝나요
  if (game.life <= 0) {
    gameOver(reason);
    return;
  }

  // 아직 하트가 남았으면, 이번 장을 처음부터 다시 해요
  showCaughtMessage(reason);
}

// "들켰다!" 알림을 보여주고, 잠시 뒤 이번 장을 다시 시작해요
function showCaughtMessage(reason) {
  stopMission();   // 하던 미션을 멈춰요
  Input.clear();   // 들킨 동안에는 버튼이 안 먹게 잠깐 꺼둬요

  el.stage.innerHTML =
    '<div class="caught-box">' +
      '<div class="caught-emoji">' + MissionUtil.figure('police', 'is-looking') + '</div>' +
      '<h3>들켰다!</h3>' +
      '<p>' + (reason || '일본 경찰에게 발각되었어요.') + '</p>' +
      '<p class="caught-sub">이번 장을 처음부터 다시 해요</p>' +
    '</div>';

  // 2초 뒤에 같은 장을 다시 시작해요
  setTimeout(startChapter, 2000);
}


/* ------------------------------------------------------------------
   6. 장(챕터) 진행하기
   ------------------------------------------------------------------ */

// 지금 장의 정보를 꺼내와요
function currentChapter() {
  return CHAPTERS[game.chapterIndex];
}

// 한 장을 화면에 펼쳐요
function startChapter() {
  const ch = currentChapter();

  // 점수판에 장 이름을 써요
  el.chapterName.textContent = ch.name;

  // 말풍선에 이야기와 미션을 써요
  el.bubbleFace.innerHTML = MissionUtil.figure(ch.face);
  el.bubbleText.textContent = ch.story + ' ' + ch.mission;

  // 6장은 어두운 밤에서 시작해요.
  // 태극기를 흔들어야 새벽이 밝아와요! (ch6.js 에서 밝게 바꿔줘요)
  document.body.classList.remove('liberation');

  // 장이 바뀌면 하던 미션과 버튼 약속을 깨끗이 정리해요
  stopMission();
  Input.clear();

  // 이번 장의 미션 게임을 찾아봐요
  const mission = MISSIONS[ch.id];

  if (mission) {
    // 미션이 있으면 시작해요!
    // 성공하면 clearChapter, 들키면 caught 를 불러달라고 부탁해요.
    currentMission = mission;
    if (mission.hint) el.bubbleText.textContent = mission.hint;
    mission.start(clearChapter, caught);

  } else {
    // 아직 안 만든 장은 연습용 버튼을 보여줘요
    currentMission = null;
    el.stage.innerHTML =
      '<div style="text-align:center">' +
        '<p class="todo-note">' + ch.id + '장 미션은 다음에 만들 거예요</p>' +
        '<button id="btn-next" class="big-btn" style="margin-top:18px">미션 성공 (연습용)</button>' +
        '<button id="btn-fail" class="small-btn" style="margin-top:12px">들키기 (연습용)</button>' +
      '</div>';

    document.getElementById('btn-next').addEventListener('click', clearChapter);
    document.getElementById('btn-fail').addEventListener('click', function () {
      caught('연습으로 들켜 봤어요!');
    });

    // 조종기 4번 버튼(다음)을 눌러도 넘어가요!
    Input.on('next', clearChapter);
  }
}

/* 지금 하고 있는 미션을 기억해둬요 (장을 옮길 때 정리하려고요) */
let currentMission = null;

/* 하던 미션을 깨끗이 정리해요 */
function stopMission() {
  if (currentMission && currentMission.stop) currentMission.stop();
  currentMission = null;
}

// 이번 장의 미션을 성공했을 때 부르는 함수예요
function clearChapter() {
  const ch = currentChapter();

  addScore(ch.point);   // 이번 장의 점수를 더해요

  // 마지막 장이었다면 게임이 끝나요
  if (game.chapterIndex >= CHAPTERS.length - 1) {
    finishGame();
    return;
  }

  // 아니면 다음 장으로 넘어가요
  game.chapterIndex += 1;
  startChapter();
}


/* ------------------------------------------------------------------
   7. 게임 시작과 끝
   ------------------------------------------------------------------ */

// 게임을 처음부터 시작해요
function startGame() {
  game.score = 0;
  game.chapterIndex = 0;
  game.life = MAX_LIFE;
  document.body.classList.remove('liberation');
  drawScore();
  drawHearts();
  if (Sound.isOn()) Sound.startBgm();   // 잔잔한 배경음악을 틀어요
  showScreen('game');
  startChapter();
}

// 모든 임무를 마쳤을 때 (이겼어요!)
function finishGame() {
  stopMission();
  Input.clear();
  Sound.fanfare();            // 짜잔! 축하 소리
  el.endEmoji.innerHTML = '광복';
  el.endTitle.textContent = '대한 독립 만세';
  el.endMessage.textContent = '모든 임무를 마치고 독립을 이루었어요. 대한 독립 만세!';
  el.endScore.textContent = game.score;
  showScreen('end');
}

// 하트를 모두 잃었을 때 (졌어요)
function gameOver(reason) {
  stopMission();
  Input.clear();
  Sound.stopBgm();            // 배경음악을 멈춰요
  document.body.classList.remove('liberation');
  el.endEmoji.innerHTML = MissionUtil.figure('police', 'is-looking');
  el.endTitle.textContent = '붙잡히고 말았다';
  el.endMessage.textContent = (reason || '일본 경찰에게 발각되었어요.') +
                              ' 하지만 포기하지 말아요. 다시 도전!';
  el.endScore.textContent = game.score;
  showScreen('end');
}


/* ==================================================================
   7-2. 5~8번 버튼이 하는 일
        이 버튼들은 게임 어디서나 항상 눌러서 쓸 수 있어요.
   ================================================================== */

/* ---------- 8번 버튼 : 글씨 크기 🔍 ----------
   아케이드 화면이 멀리 있으면 글씨가 작아 보여요.
   8번을 누를 때마다 글씨가 커지고, 제일 커지면 다시 처음 크기로 돌아와요. */
const ZOOM_STEPS = [1, 1.15, 1.3];   // 100% → 115% → 130% → 다시 100%
let zoomStep = 0;

function toggleZoom() {
  zoomStep = (zoomStep + 1) % ZOOM_STEPS.length;   // 다음 크기로 넘어가요
  const size = ZOOM_STEPS[zoomStep];

  // 화면 전체를 그만큼 크게 그려요
  document.body.style.zoom = size;

  showToast('글씨 크기 ' + Math.round(size * 100) + '%');
}


/* ---------- 5번 버튼 : 소리 크기 🔊 ----------
   누를 때마다 소리가 한 단계씩 바뀌어요.
   꺼짐 → 작게 → 보통 → 크게 → 다시 꺼짐 ... */
function changeVolume() {
  const level = Sound.cycleVolume();
  showToast(level.label);
  if (level.value > 0) Sound.pok();   // 바뀐 크기를 소리로 확인시켜줘요
}

/* 화면 아래에 잠깐 떴다 사라지는 알림이에요 */
let toastTimer = null;
function showToast(text) {
  const node = document.getElementById('zoom-toast');
  node.textContent = text;
  node.classList.add('is-on');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    node.classList.remove('is-on');
  }, 1200);
}


/* ---------- 덮개 화면 도우미 ----------
   멈추기 · 도움말 · 처음으로 가 모두 이 창을 함께 써요. */
const overlay = {
  box:     document.getElementById('overlay'),
  emoji:   document.getElementById('overlay-emoji'),
  title:   document.getElementById('overlay-title'),
  body:    document.getElementById('overlay-body'),
  actions: document.getElementById('overlay-actions'),
};

let overlayOpen = false;   // 지금 덮개가 열려 있는지 기억해요

/* 덮개 창을 열어요.
   buttons 는 [{ label: '글자', run: 누르면할일 }] 모양이에요. */
function openOverlay(emoji, title, bodyHtml, buttons) {
  overlay.emoji.textContent = emoji;
  overlay.title.textContent = title;
  overlay.body.innerHTML = bodyHtml;
  overlay.actions.innerHTML = '';

  // 아래쪽 버튼들을 만들어 붙여요
  (buttons || []).forEach(function (b) {
    const btn = document.createElement('button');
    btn.className = b.big ? 'big-btn' : 'small-btn';
    btn.textContent = b.label;
    btn.addEventListener('click', b.run);
    overlay.actions.appendChild(btn);
  });

  overlay.box.classList.add('is-on');
  overlayOpen = true;
  game.paused = true;          // 게임을 잠깐 멈춰요
  Input.setBlocked(true);      // 게임 조작도 잠깐 쉬어요
}

/* 덮개 창을 닫아요 */
function closeOverlay() {
  overlay.box.classList.remove('is-on');
  overlayOpen = false;
  game.paused = false;         // 다시 게임이 움직여요
  Input.setBlocked(false);     // 게임 조작도 다시 켜요
}


/* ---------- 6번 버튼 : 잠깐 멈추기 ⏸️ ---------- */
function togglePause() {
  if (overlayOpen) { closeOverlay(); return; }   // 이미 열려 있으면 닫아요

  const lv = Sound.level();
  openOverlay('멈춤', '잠깐 멈춤',
    '<p style="text-align:center">잠깐 쉬는 중이에요.<br>' +
    '6번 버튼을 다시 누르면 이어서 해요!</p>' +
    '<p style="text-align:center;margin-top:10px;opacity:.75;font-size:13px">' +
    '지금 소리 : <b>' + lv.icon + ' ' + lv.label + '</b>' +
    ' &nbsp;(5번 버튼으로 바꿔요)</p>',
    [
      { label: '이어서 하기', run: closeOverlay, big: true },
      { label: '조종기 확인·맞추기', run: function () { closeOverlay(); openPadTest(); } },
    ]);
}


/* ---------- 조작 방법 보기 ❓ ----------
   시작 화면의 '설명란'에서 볼 수 있어요. */
function showHelp() {
  if (overlayOpen) { closeOverlay(); return; }

  openOverlay('조작', '조작 방법', buildControlRows(),
    [{ label: '닫기', run: closeOverlay, big: true }]);
}


/* ---------- 7번 버튼 : 처음으로 🏠 ----------
   잘못 눌러서 게임이 날아가면 속상하니까, 한 번 더 물어봐요. */
function askGoHome() {
  if (overlayOpen) { closeOverlay(); return; }

  openOverlay('처음', '처음으로 갈까요?',
    '<p style="text-align:center">지금까지 모은 독립 포인트가 사라져요.<br>정말 처음 화면으로 갈까요?</p>',
    [
      { label: '아니요, 계속할래요', run: closeOverlay, big: true },
      { label: '네, 처음으로', run: function () { closeOverlay(); goTitle(); } },
    ]);
}


/* ---------- 5~8번 버튼을 진짜로 연결해요 ----------
   onSystem 으로 걸면 장이 바뀌어도 지워지지 않아요! */
Input.onSystem('volume', changeVolume);   // 5번
Input.onSystem('pause',  togglePause);    // 6번
Input.onSystem('home',   askGoHome);      // 7번
Input.onSystem('zoom',   toggleZoom);     // 8번


/* ------------------------------------------------------------------
   8. 버튼에 기능을 연결해요
      마우스로 눌러도 되고, 키보드나 조종기로 눌러도 돼요.
   ------------------------------------------------------------------ */

// 시작 화면으로 돌아가요
function goTitle() {
  stopMission();
  Input.clear();
  document.body.classList.remove('liberation');
  showScreen('title');
  // 시작 화면에서는 어느 버튼을 눌러도 게임이 시작돼요
  Input.on('next', startGame);
  Input.on('jump', startGame);
}

el.btnStart.addEventListener('click', startGame);
el.btnRetry.addEventListener('click', goTitle);

/* 시작 화면 왼쪽 아래 '설명란' ❓ 버튼이에요.
   누르면 게임 이야기와 목표를 알려줘요. */
document.getElementById('btn-info').addEventListener('click', function () {
  openOverlay('설명', '게임 설명',
    '<p>때는 <b>1940년대 일제강점기</b>.</p>' +
    '<p>조선은 일본의 지배를 받고 있고,<br>' +
    '사람들은 자유를 잃은 채 힘들게 살고 있어요.</p>' +
    '<p>주인공은 학교에서 돌아오는 길에<br>' +
    '독립운동가를 만나 비밀 임무를 맡게 돼요.</p>' +
    '<p style="color:#ffe9a8;margin-top:10px">' +
    '<b>목표는 단 하나, 독립!</b></p>' +
    '<p style="margin-top:10px">임무 6개를 하나씩 해결하면 광복을 맞이해요.<br>' +

    buildControlRows(),
    [{ label: '알겠어요', run: closeOverlay, big: true }]);
});

/* 조작 방법 표를 만들어요.
   버튼 정보표를 그대로 읽어오니까, 버튼이 바뀌면 설명도 저절로 바뀌어요! */
function buildControlRows() {
  let rows = '<div class="help-row">' +
               '<span class="no">🕹️</span><span>움직이기</span>' +
               '<span class="keys">방향키 / 스틱</span>' +
             '</div>';

  Input.buttons.forEach(function (b) {
    rows += '<div class="help-row">' +
              '<span class="no">' + b.no + '</span>' +
              '<span>' + b.emoji + ' ' + b.label + '</span>' +
              '<span class="keys">' + b.keys.join(' / ') + '</span>' +
            '</div>';
  });
  return rows;
}

/* ==================================================================
   조종기 확인 화면
   ★ 아케이드 조종기를 꽂았을 때 신호가 제대로 들어오는지
     눈으로 볼 수 있어요. 잘 안 될 때 원인을 찾는 데 써요.
   ================================================================== */
let padTestTimer = null;

function openPadTest() {
  openOverlay('확인', '조종기 확인',
    '<p style="text-align:center;margin-bottom:12px">' +
      '조종기의 스틱과 버튼을 하나씩 움직여 보세요.<br>' +
      '들어오는 신호가 아래에 그대로 나타나요.</p>' +
    '<div id="pad-test-body" class="pad-test"></div>',
    [
      { label: '조종기 맞추기', run: function () { closePadTest(); startSetup(); }, big: true },
      { label: '기본값으로', run: function () { Input.clearMap(); drawPadTest(); } },
      { label: '닫기', run: closePadTest },
    ]);

  // 1초에 여러 번 다시 그려서 실시간으로 보여줘요
  clearInterval(padTestTimer);
  padTestTimer = setInterval(drawPadTest, 100);
  drawPadTest();
}

function closePadTest() {
  clearInterval(padTestTimer);
  padTestTimer = null;
  closeOverlay();
}

/* 조종기 확인 화면이 열려 있는 동안에도 화면이 계속 새로 그려지도록,
   덮개를 닫을 때 시계를 확실히 멈춰요 */
const _closeOverlay = closeOverlay;
closeOverlay = function () {
  clearInterval(padTestTimer);
  padTestTimer = null;
  clearInterval(setupTimer);
  setupTimer = null;
  _closeOverlay();
};

function drawPadTest() {
  const box = document.getElementById('pad-test-body');
  if (!box) { clearInterval(padTestTimer); return; }

  const pads = Input.readPads();

  /* --- 조종기가 아예 안 잡힐 때 --- */
  if (pads.length === 0) {
    box.innerHTML = padMissingHtml() +
      (Input.inFrame() ? '' :
        '<ul class="pad-test-help">' +
          '<li>왼쪽 스위치(기종 선택)를 <b>XINPUT / NS</b> (위쪽)에 두세요.</li>' +
          '<li>오른쪽 스위치(스틱 신호)를 <b>DP</b> (가운데)에 두세요.</li>' +
        '</ul>');
    return;
  }

  /* --- 조종기가 잡혔을 때 : 신호를 그대로 보여줘요 --- */
  const pad = pads[0];

  // 방향이 지금 눌려 있는지
  const dirText = ['up', 'down', 'left', 'right'].map(function (name) {
    const on = Input.dir[name];
    const mark = { up: '▲', down: '▼', left: '◀', right: '▶' }[name];
    return '<span class="pt-dir' + (on ? ' is-on' : '') + '">' + mark + '</span>';
  }).join('');

  // 버튼 8개가 눌려 있는지
  let btnText = '';
  for (let i = 0; i < 8; i++) {
    const on = pad.buttons[i];
    btnText += '<span class="pt-btn' + (on ? ' is-on' : '') + '">' + (i + 1) + '</span>';
  }

  // 축(스틱) 값들
  const axesText = pad.axes.map(function (v, i) {
    const moved = Math.abs(v) > 0.3;
    return '<span class="pt-axis' + (moved ? ' is-on' : '') + '">' +
             i + ' : ' + v.toFixed(2) +
           '</span>';
  }).join('');

  box.innerHTML =
    '<div class="pt-row"><span class="pt-label">이름</span>' +
      '<span class="pt-value">' + pad.id.slice(0, 42) + '</span></div>' +
    '<div class="pt-row"><span class="pt-label">방식</span>' +
      '<span class="pt-value">' +
        (pad.mapping === 'standard' ? 'XINPUT (표준) — 좋아요' : 'DINPUT (표준 아님)') +
      '</span></div>' +
    '<div class="pt-row"><span class="pt-label">방향</span>' +
      '<span class="pt-value">' + dirText + '</span></div>' +
    '<div class="pt-row"><span class="pt-label">버튼</span>' +
      '<span class="pt-value">' + btnText + '</span></div>' +
    '<div class="pt-row"><span class="pt-label">축</span>' +
      '<span class="pt-value pt-axes">' + axesText + '</span></div>' +
    '<p class="pad-test-tip">' +
      '<b>스위치 두 개를 이렇게 두세요</b><br>' +
      '· 왼쪽(기종 선택) → <b>XINPUT / NS</b> (위쪽)<br>' +
      '· 오른쪽(스틱 신호) → <b>DP</b> (가운데)<br><br>' +
      '스틱을 움직였는데 위 「방향」에 불이 안 들어오면 ' +
      '「조종기 맞추기」를 해보세요.</p>';
}

document.getElementById('btn-pad-test').addEventListener('click', openPadTest);

/* 게임 화면 아래쪽 '조종기 연결됨' 칸을 눌러도 확인 화면이 열려요.
   (게임 도중에 조종기를 맞추고 싶을 때 쓰라고 만들었어요) */
document.getElementById('pad-device').addEventListener('click', openPadTest);


/* ==================================================================
   조종기 맞추기 (하나씩 따라 하기)

   ★ 조종기는 종류마다 신호가 달라요.
     그래서 "스틱을 위로 미세요" 하고 물어보고,
     선생님이 실제로 움직이면 그 신호를 그대로 기억해요.
     이렇게 하면 어떤 조종기든 무조건 작동해요!
   ================================================================== */

/* 물어볼 순서예요. 방향 4개 + 버튼 8개 */
const SETUP_STEPS = [
  { kind: 'dir', key: 'up',    ask: '스틱을 위로 미세요',    icon: '▲' },
  { kind: 'dir', key: 'down',  ask: '스틱을 아래로 미세요',  icon: '▼' },
  { kind: 'dir', key: 'left',  ask: '스틱을 왼쪽으로 미세요', icon: '◀' },
  { kind: 'dir', key: 'right', ask: '스틱을 오른쪽으로 미세요', icon: '▶' },
  { kind: 'act', key: 'jump',   ask: '「점프」로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'talk',   ask: '「말걸기」로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'attack', ask: '「공격」으로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'next',   ask: '「다음」으로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'volume', ask: '「소리 크기」로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'pause',  ask: '「잠시 멈춤」으로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'home',   ask: '「처음으로」로 쓸 버튼을 누르세요' },
  { kind: 'act', key: 'zoom',   ask: '「글씨 크기」로 쓸 버튼을 누르세요' },
];

let setupIndex = 0;
let setupMap = null;
let setupBase = null;      // 누르기 직전의 조종기 상태 (사진)
let setupTimer = null;

/* 설정을 시작해요 */
function startSetup() {
  setupIndex = 0;
  setupMap = { dirs: {}, acts: {} };
  openOverlay('설정', '조종기 맞추기',
    '<div id="setup-body" class="setup"></div>',
    [
      { label: '이 단계 건너뛰기', run: skipSetupStep },
      { label: '그만두기', run: stopSetup },
    ]);
  nextSetupStep();
}

/* 다음 단계로 넘어가요 */
function nextSetupStep() {
  clearInterval(setupTimer);

  if (setupIndex >= SETUP_STEPS.length) { finishSetup(); return; }

  drawSetup();

  // 잠깐 기다렸다가 지금 상태를 사진 찍어요
  // (앞 단계에서 누른 버튼을 아직 떼지 않았을 수 있으니까요)
  setTimeout(function () {
    setupBase = Input.snapshot();
    setupTimer = setInterval(watchSetup, 60);
  }, 450);
}

/* 조종기에서 새 신호가 들어오는지 지켜봐요 */
function watchSetup() {
  if (!setupBase) { setupBase = Input.snapshot(); return; }

  const found = Input.findChange(setupBase);
  if (!found) return;

  const step = SETUP_STEPS[setupIndex];
  if (step.kind === 'dir') setupMap.dirs[step.key] = found;
  else                     setupMap.acts[step.key] = found;

  Sound.pok();
  setupIndex += 1;
  nextSetupStep();
}

/* 이 단계를 건너뛰어요 (기본값을 그대로 써요) */
function skipSetupStep() {
  setupIndex += 1;
  nextSetupStep();
}

/* 설정 화면을 그려요 */
function drawSetup() {
  const box = document.getElementById('setup-body');
  if (!box) return;

  const step = SETUP_STEPS[setupIndex];

  /* 무슨 일이 있어도 '지금 무엇을 해야 하는지'는 꼭 보이게 해요.
     아래에서 문제가 생겨도 이 글은 이미 화면에 있어요. */
  let html =
    '<p class="setup-count">' + (setupIndex + 1) + ' / ' + SETUP_STEPS.length + '</p>' +
    '<p class="setup-ask">' + step.ask + '</p>';

  try {
    const pads = Input.readPads();

    if (pads.length === 0) {
      html += padMissingHtml();
    } else {
      html += '<p class="setup-wait">기다리는 중…</p>';

      // 지금까지 정한 것들을 보여줘요
      let done = '';
      for (let i = 0; i < setupIndex; i++) {
        const st = SETUP_STEPS[i];
        const rule = (st.kind === 'dir') ? setupMap.dirs[st.key] : setupMap.acts[st.key];
        done += '<div class="setup-done">' +
                  '<span>' + (st.icon || SETUP_NAMES[st.key]) + '</span>' +
                  '<span>' + (rule ? rule.label : '건너뜀') + '</span>' +
                '</div>';
      }
      if (done) html += '<div class="setup-list">' + done + '</div>';
    }
  } catch (e) {
    html += '<p class="setup-none">조종기를 읽는 중 문제가 생겼어요.<br>' +
            '아래 「이 단계 건너뛰기」로 넘어갈 수 있어요.</p>';
  }

  box.innerHTML = html;
}

/* 조종기가 안 잡힐 때 보여줄 안내예요.
   ★ 가장 흔한 원인은 이 페이지가 '창 안의 창' 안에서 열린 거예요. */
function padMissingHtml() {
  const framed = Input.inFrame() || Input.isBlocked();

  let html = '<p class="setup-none">조종기가 잡히지 않았어요.</p>';

  if (framed) {
    html +=
      '<div class="setup-frame">' +
        '<p><b>이 페이지가 창 안의 창(iframe)에서 열려 있어요.</b></p>' +
        '<p>브라우저는 이럴 때 조종기 사용을 막는 경우가 많아요.</p>' +
        '<p class="setup-fix">주소창에 게임 주소를 <b>직접 붙여넣어 새 탭에서</b> 열어 주세요. ' +
        '그러면 조종기가 잡혀요!</p>' +
      '</div>';
  } else {
    html +=
      '<ul class="pad-test-help">' +
        '<li>조종기의 <b>아무 버튼이나 한 번</b> 눌러 보세요.</li>' +
        '<li>왼쪽 스위치를 <b>XINPUT / NS</b> (위쪽)에 두세요.</li>' +
        '<li>USB 를 뺐다 꽂고 새로고침하세요.</li>' +
      '</ul>';
  }
  return html;
}

/* 동작 이름을 한글로 보여주려고 만든 표예요 */
const SETUP_NAMES = {
  jump: '점프', talk: '말걸기', attack: '공격', next: '다음',
  volume: '소리', pause: '멈춤', home: '처음', zoom: '글씨',
};

/* 다 맞췄어요! */
function finishSetup() {
  clearInterval(setupTimer);
  Input.saveMap(setupMap);
  Sound.fanfare();

  let list = '';
  SETUP_STEPS.forEach(function (s) {
    const rule = (s.kind === 'dir') ? setupMap.dirs[s.key] : setupMap.acts[s.key];
    list += '<div class="setup-done">' +
              '<span>' + (s.icon || SETUP_NAMES[s.key]) + '</span>' +
              '<span>' + (rule ? rule.label : '건너뜀') + '</span>' +
            '</div>';
  });

  openOverlay('완료', '조종기 맞추기 끝!',
    '<p style="text-align:center;margin-bottom:12px">' +
      '이제 조종기로 게임을 할 수 있어요.<br>' +
      '이 설정은 저장돼서 다음에 켜도 그대로예요.</p>' +
    '<div class="setup-list">' + list + '</div>',
    [{ label: '좋아요', run: closeOverlay, big: true }]);
}

/* 도중에 그만둬요 */
function stopSetup() {
  clearInterval(setupTimer);
  setupTimer = null;
  closeOverlay();
}


/* 화면의 모든 버튼을 마우스로 누를 때도 '뽁' 소리가 나요 */
document.addEventListener('click', function (e) {
  if (e.target.closest('button') && !e.target.closest('.pad-btn')) Sound.pok();
});

// 게임이 켜지면 시작 화면부터 보여줘요
goTitle();

</script>
